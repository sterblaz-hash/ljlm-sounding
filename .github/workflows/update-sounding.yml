name: Update LJLM sounding

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update LJLM sounding
        run: python extract_ljlm.py

      - name: Commit and push
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data climatology diagnostics 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No sounding changes to commit."
            exit 0
          fi

          git commit -m "Update LJLM sounding"

          # Another workflow or a manual edit may have updated main while this
          # job was processing DWD BUFR files. Rebase our commit onto the
          # newest main before pushing, avoiding non-fast-forward failures.
          git pull --rebase origin main
          git push origin HEAD:main
