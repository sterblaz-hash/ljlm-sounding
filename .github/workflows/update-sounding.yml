name: Update LJLM sounding

on:
  # Omogoča tudi ročni zagon iz zavihka Actions
  workflow_dispatch:

  # Samodejni zagoni po terminih 00 in 12 UTC.
  # Več poskusov, ker se BUFR pri DWD lahko pojavi z zamikom.
  schedule:
    - cron: "10,30,50 0 * * *"
    - cron: "10,30,50 12 * * *"

jobs:
  update-sounding:
    runs-on: ubuntu-latest

    # Workflow potrebuje dovoljenje za zapis JSON datotek
    # nazaj v repozitorij.
    permissions:
      contents: write

    steps:
      # --------------------------------------------------------
      # 1. Prenos vsebine našega repozitorija
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # --------------------------------------------------------
      # 2. Python
      # --------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      # --------------------------------------------------------
      # 3. Namestitev ecCodes
      # --------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------------
      # 4. Prenos in dekodiranje LJLM / WMO 14015
      # --------------------------------------------------------
      - name: Retrieve Ljubljana sounding
        run: |
          python extract_ljlm.py

      # --------------------------------------------------------
      # 5. Kontrolni izpis rezultata v Actions log
      # --------------------------------------------------------
      - name: Show result
        run: |
          echo "Contents of data/latest.json:"
          cat data/latest.json

      # --------------------------------------------------------
      # 6. Shranjevanje nove sondaže v GitHub
      # --------------------------------------------------------
      - name: Save sounding to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No new sounding to save."
          else
            git commit -m "Update LJLM sounding"
            git push
          fi
