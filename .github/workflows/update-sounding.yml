name: Test LJLM MetPy

on:
  workflow_dispatch:

jobs:
  test-sounding:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retrieve and analyse Ljubljana sounding
        run: |
          python extract_ljlm.py

      - name: Show generated parameters
        run: |
          echo "========================================"
          echo "LATEST.JSON"
          echo "========================================"
          cat data/latest.json
