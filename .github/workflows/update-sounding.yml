name: Update LJLM sounding

on:
  workflow_dispatch: {}

  schedule:
    # GitHub cron uses UTC.
    # Hourly discovery catches both regular 00/12 UTC profiles
    # and occasional special LJLM soundings.
    - cron: "17 * * * *"

concurrency:
  group: update-ljlm-sounding
  cancel-in-progress: false

jobs:
  update-sounding:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Discover Ljubljana soundings
        run: |
          python extract_ljlm.py

      - name: Validate newest sounding
        if: always()
        run: |
          if [ ! -f data/latest.json ]; then
            echo "ERROR: data/latest.json does not exist."
            exit 1
          fi

          python - <<'PY'
          import json

          with open("data/latest.json", "r", encoding="utf-8") as f:
              d = json.load(f)

          print("Launch:", d.get("launch_time"))
          print("Nominal:", d.get("nominal_date"), d.get("term"))
          print("Sounding ID:", d.get("sounding_id"))
          print("Classification:", d.get("sounding_classification"))

          trajectory = d.get("trajectory", {})
          print(
              "Trajectory:",
              trajectory.get("available"),
              "| raw points:",
              trajectory.get("raw_point_count"),
              "| display points:",
              trajectory.get("display_point_count"),
              "| max height:",
              trajectory.get("max_height_m"),
          )

          metpy = d.get("parameters", {}).get("metpy", {})
          print("MLCAPE:", metpy.get("mlcape_jkg"))
          print("MUCAPE:", metpy.get("mucape_jkg"))
          print(
              "CAPE corrections:",
              metpy.get("qc", {}).get("cape_corrections", [])
          )

          classification = d.get("sounding_classification", {})
          if classification.get("kind") not in ("regular", "special"):
              raise SystemExit("Invalid sounding classification")

          if trajectory.get("available") is not True:
              raise SystemExit("Trajectory is unavailable in newest sounding")
          PY

      - name: Commit sounding archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "Update LJLM sounding"
            git push
          fi
