name: Diagnose LJLM moisture

on:
  # Diagnostiko zaganjamo samo ročno
  workflow_dispatch:

jobs:
  diagnose-moisture:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # 1. Prenos repozitorija
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # --------------------------------------------------------
      # 2. Python
      # --------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      # --------------------------------------------------------
      # 3. Namestitev ecCodes
      # --------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------------
      # 4. Diagnostika vlage v LJLM BUFR
      # --------------------------------------------------------
      - name: Diagnose moisture data
        run: |
          python diagnose_moisture.py
