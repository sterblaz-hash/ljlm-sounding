name: Update LJLM sounding

on:
  workflow_dispatch:
  schedule:
    # Glavna termina: približno eno uro po rednem izpustu 00/12 UTC.
    - cron: "50 0,12 * * *"

    # Rezervni poskus eno uro pozneje, če podatki na DWD zamujajo.
    - cron: "50 1,13 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update LJLM sounding
        run: python extract_ljlm.py

      - name: Commit and push
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Dodaj vse rezultate projekta.
          git add -A data climatology diagnostics 2>/dev/null || true

          # Cache mora ostati med posameznimi GitHub Actions zagoni.
          # -f ga doda tudi, če je v .gitignore.
          if [ -f data/dwd_scan_cache.json ]; then
            git add -f data/dwd_scan_cache.json
          fi

          echo "=== Git status before commit ==="
          git status --short

          if git diff --cached --quiet; then
            echo "No sounding changes to commit."
            exit 0
          fi

          git commit -m "Update LJLM sounding"

          echo "=== Git status after commit ==="
          git status --short

          # Če je med obdelavo repozitorij napredoval,
          # rebase našega commita na najnovejši main.
          # --autostash varno začasno umakne morebitne
          # preostale lokalne spremembe.
          git pull --rebase --autostash origin main

          git push origin HEAD:main
