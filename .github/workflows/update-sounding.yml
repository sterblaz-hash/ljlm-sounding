name: Update LJLM sounding

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - Update ICON-D2 LJLM +12 h forecasts
      - Update C-LAEF LJLM +12 h sounding
    types: [completed]
    branches: [main]

  schedule:
    # Primary + reserve checks. GitHub scheduled events can occasionally be
    # delayed or dropped, so add independent staggered catch-up runs.
    - cron: "50 0,1,12,13 * * *"
    - cron: "20 1,2,3,13,14,15 * * *"

permissions:
  contents: write

# Prevent overlapping OBS writers from colliding with one another.
concurrency:
  group: ljlm-observation-main
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync current main before installing dependencies
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --retries 10 --timeout 60 -r requirements.txt

      - name: Test LJLM publication recovery offline
        run: python -m unittest test_publish_ljlm -v

      - name: Update and publish LJLM from a fresh main checkout
        env:
          MPLBACKEND: Agg
          PYTHONDONTWRITEBYTECODE: "1"
        run: python publish_ljlm.py
