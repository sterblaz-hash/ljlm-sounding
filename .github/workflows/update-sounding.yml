name: Update LJLM sounding

on:
  workflow_dispatch:

  schedule:
    - cron: "50 0,1,12,13 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --retries 10 --timeout 60 -r requirements.txt

      - name: Update LJLM sounding
        run: python extract_ljlm.py

      - name: Render Skew-T and hodograph
        run: python render_ljlm.py --input data/latest.json

      - name: Render matching OBS and ICON-D2 overlay
        run: python render_icon_d2_verification.py

      - name: Update dashboard data
        run: python build_dashboard_data.py --sync-recent-hours 72

      - name: Commit and push
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A climatology diagnostics timeseries 2>/dev/null || true

          if [ -d verification ]; then
            git add -A -- verification
          fi

          if [ -d data ]; then
            find data -type f -name "*.json" -print0 | xargs -0 -r git add -f --
          fi

          echo "=== Git status before commit ==="
          git status --short

          if git diff --cached --quiet; then
            echo "No sounding changes to commit."
            exit 0
          fi

          git commit -m "Update LJLM sounding"

          echo "=== Git status after commit ==="
          git status --short

          git pull --rebase --autostash origin main
          git push origin HEAD:main
