name: Update C-LAEF LJLM +12 h sounding

on:
  schedule:
    - cron: "5 7 * * *"   # 00 UTC primary
    - cron: "5 10 * * *"  # 00 UTC retry if GeoSphere was delayed or unavailable
    - cron: "5 19 * * *"  # 12 UTC primary
    - cron: "5 22 * * *"  # 12 UTC retry for the same exact cycle
  workflow_dispatch:
    inputs:
      run_cycle:
        description: "C-LAEF run cycle (UTC); lead is always +12 h"
        type: choice
        options: ["00", "12"]
        default: "00"
        required: true
      run_date:
        description: "UTC run date YYYY-MM-DD; blank selects most recent chosen cycle"
        type: string
        default: ""
        required: false

permissions:
  contents: write

concurrency:
  group: claef-ljlm-sounding-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sounding:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select explicit 00 or 12 UTC run
        id: run
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          RUN_CYCLE: ${{ inputs.run_cycle }}
          RUN_DATE: ${{ inputs.run_date }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            run_time=$(python claef_sounding_run.py --schedule "$SCHEDULE")
          else
            run_time=$(python claef_sounding_run.py --cycle "$RUN_CYCLE" --run-date "$RUN_DATE")
          fi
          echo "time=$run_time" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u -d "$run_time" +%Y%m%d%H)" >> "$GITHUB_OUTPUT"
          echo "slot=$(date -u -d "$run_time +12 hours" +%H)" >> "$GITHUB_OUTPUT"
          echo "C-LAEF run $run_time, fixed lead +12 h" >> "$GITHUB_STEP_SUMMARY"

      - name: Check whether requested cycle is already published
        id: published
        shell: bash
        env:
          RUN_STAMP: ${{ steps.run.outputs.stamp }}
          SLOT: ${{ steps.run.outputs.slot }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          stamp = os.environ['RUN_STAMP']
          archive = Path(f'models/claef/{stamp}/ljlm_f012.json')
          latest = Path(f"models/claef/latest/{os.environ['SLOT']}/sounding.json")
          run = datetime.strptime(stamp, '%Y%m%d%H').replace(tzinfo=timezone.utc)
          valid = run + timedelta(hours=12)
          complete = False
          if archive.is_file() and latest.is_file():
              try:
                  archived = json.loads(archive.read_text())
                  current = json.loads(latest.read_text())
                  current_valid = datetime.fromisoformat(current['valid_time'].replace('Z', '+00:00'))
                  complete = (archived['run_time'] == run.isoformat().replace('+00:00', 'Z')
                              and current_valid >= valid)
              except (OSError, ValueError, KeyError, TypeError):
                  pass
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'skip={str(complete).lower()}\n')
          if complete:
              print(f'C-LAEF cycle {stamp} is already safely archived; skipping repeat extraction.')
          PYTHON

      - name: Install dependencies
        if: steps.published.outputs.skip != 'true'
        run: python -m pip install --retries 10 --timeout 60 -r requirements.txt h5py==3.16.0

      - name: Test pressure profile and sounding offline
        if: steps.published.outputs.skip != 'true'
        run: python -m unittest test_claef_pressure_profile test_claef_sounding -v

      - name: Generate +12 h sounding and verification slot
        if: steps.published.outputs.skip != 'true'
        env:
          RUN_TIME: ${{ steps.run.outputs.time }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python extract_claef.py --run "$RUN_TIME" --lead-hours 12 --publish-verification; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Requested run $RUN_TIME unavailable or extraction failed; retrying the same run in 10 minutes."
              sleep 600
            fi
          done
          echo "Failed to generate requested run; no substitute cycle will be used." >&2
          exit 1

      - name: Upload sounding products
        if: steps.published.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: claef-${{ steps.run.outputs.stamp }}-f012
          path: |
            models/claef/${{ steps.run.outputs.stamp }}/ljlm_f012.json
            models/claef/${{ steps.run.outputs.stamp }}/diagnostics/f012/
            models/claef/latest/${{ steps.run.outputs.slot }}/
          if-no-files-found: error
          retention-days: 30

      - name: Persist C-LAEF sounding products only
        if: steps.published.outputs.skip != 'true'
        env:
          RUN_STAMP: ${{ steps.run.outputs.stamp }}
          SLOT: ${{ steps.run.outputs.slot }}
          PUBLISH_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "models/claef/$RUN_STAMP/ljlm_f012.json" \
            "models/claef/$RUN_STAMP/diagnostics/f012/"
          git add -- "models/claef/latest/$SLOT/"
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git commit -m "Update C-LAEF $RUN_STAMP +12 h LJLM sounding"
          # Concurrent publishers may advance the branch; conflicts stop this step.
          for attempt in 1 2 3; do
            git pull --rebase origin "$PUBLISH_BRANCH"
            if git push origin "HEAD:$PUBLISH_BRANCH"; then
              exit 0
            fi
          done
          echo "Unable to publish after three attempts; no force push attempted." >&2
          exit 1
