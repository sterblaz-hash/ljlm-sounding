name: Build LJLM climatology

on:
  workflow_dispatch:

jobs:
  build-climatology:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Ljubljana climatology
        run: |
          python build_climatology.py

      - name: Show climatology file
        run: |
          ls -lh climatology/daily_climatology.json

      - name: Commit climatology
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add climatology/daily_climatology.json

          if git diff --cached --quiet; then
            echo "Climatology has not changed."
          else
            git commit -m "Build LJLM climatology"
            git push
          fi
