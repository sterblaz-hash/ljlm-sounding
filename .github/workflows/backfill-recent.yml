name: Backfill recent LJLM soundings

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backfill all currently available LJLM soundings
        run: |
          python backfill_recent.py

      - name: Show archive
        if: always()
        run: |
          find data -type f -name "*.json" | sort

      - name: Commit backfilled soundings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "Backfill recent LJLM soundings"
            git push
          fi
