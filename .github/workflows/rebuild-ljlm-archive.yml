name: Rebuild LJLM archive

on:
  workflow_dispatch: {}

concurrency:
  group: rebuild-ljlm-archive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rebuild archive
        run: |
          python rebuild_archive.py

      - name: Validate rebuilt archive
        run: |
          python - <<'PY'
          import glob
          import json

          files = sorted(glob.glob("data/*/*/*.json"))
          print("Archive JSON files:", len(files))

          with open("data/latest.json", "r", encoding="utf-8") as f:
              d = json.load(f)

          levels = d.get("levels", [])
          inv = d.get("parameters", {}).get("inversions", {})

          print("Latest:", d.get("sounding_id"), d.get("launch_time"))
          print("Levels:", len(levels))
          print(
              "Theta levels:",
              sum(x.get("potential_temperature_k") is not None for x in levels)
          )
          print(
              "Theta-e levels:",
              sum(
                  x.get("equivalent_potential_temperature_k") is not None
                  for x in levels
              )
          )
          print(
              "Inversions:",
              inv.get("summary", {}).get("total_count")
          )

          assert files, "No archive JSON files found"
          assert levels, "latest.json has no levels"
          assert any(
              x.get("potential_temperature_k") is not None for x in levels
          ), "theta missing"
          assert any(
              x.get("equivalent_potential_temperature_k") is not None
              for x in levels
          ), "theta-e missing"
          assert isinstance(inv.get("layers"), list), "inversions missing"
          PY

      - name: Commit rebuilt archive
        run: |
          if git diff --quiet -- data; then
            echo "No archive changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data
          git commit -m "Rebuild LJLM archive with theta, theta-e and inversions"
          git push
