name: Backfill LJLM rendered products

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --retries 10 --timeout 60 -r requirements.txt

      - name: Render archived soundings
        run: python render_ljlm.py --backfill

      - name: Show generated files
        shell: bash
        run: |
          echo "=== Generated/changed diagnostics ==="
          git status --short diagnostics || true

      - name: Commit and push rendered archive
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A diagnostics

          if git diff --cached --quiet; then
            echo "No rendered archive changes to commit."
            exit 0
          fi

          git commit -m "Backfill LJLM rendered products"

          git pull --rebase --autostash origin main
          git push origin HEAD:main
