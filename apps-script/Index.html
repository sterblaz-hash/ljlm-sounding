<!DOCTYPE html>

<html lang="en">

<head>

  <base target="_top">



  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <style>
    .trajectory-tiles-light { filter:contrast(1.12) saturate(1.05); }
    .trajectory-tiles-dark { filter:contrast(1.08) brightness(1.16); }
    .trajectory-toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:12px; }
    .trajectory-toolbar .trajectory-basemap-controls { margin-left:auto; }
    .trajectory-date-nav { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .trajectory-date-nav select { width:auto; min-width:0; max-width:100%; }
    .trajectory-overview { display:flex; gap:8px; max-width:100%; overflow-x:auto; margin-top:14px; padding-bottom:6px; }
    .trajectory-day { flex:0 0 100px; border:1px solid var(--line); border-radius:9px; background:#fff; padding:6px; cursor:pointer; color:var(--muted); font-size:11px; }
    .trajectory-day.active { border-color:var(--blue); background:var(--blue-soft); }
    .trajectory-day-terms { display:flex; justify-content:center; gap:10px; margin-top:4px; font-size:10px; }
    .trajectory-day svg { display:block; width:88px; height:70px; }
    .trajectory-stat { min-width:0; overflow-wrap:anywhere; }
    .trajectory-density-legend i { width:90px; border-radius:3px; background:linear-gradient(90deg,#438ca9,#68b9ae,#e9c65b,#cf7248); }
    .trajectory-body { padding: 4px 18px 18px; min-width: 0; }
    .trajectory-controls { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0; }
    .trajectory-basemap-controls { display:flex; align-items:center; gap:6px; }
    .trajectory-basemap-controls button:disabled { opacity:.45; cursor:default; }
    .trajectory-summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; margin:20px 0; }
    .trajectory-stat { padding:12px 16px; border:1px solid var(--line); border-radius:10px; }
    .trajectory-stat span { display:block; color:var(--muted); font-size:12px; margin-bottom:6px; }
    .trajectory-stat strong { font-size:20px; font-weight:600; }
    .trajectory-map { height:650px; width:100%; border:1px solid var(--line); border-radius:12px; background:#f3f7fb; z-index:0; }
    .trajectory-legend { display:flex; flex-wrap:wrap; gap:18px; margin-top:12px; color:var(--muted); font-size:12px; }
    .trajectory-legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
    @media (max-width:600px) {
      .trajectory-summary { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
      .trajectory-stat { padding:10px; }
      .trajectory-stat strong { font-size:17px; }
      .trajectory-map { height:min(65vh,550px); min-height:340px; }
    }


    :root {

      --bg: #f3f7fb;

      --panel: #ffffff;

      --line: #dfe7f0;

      --line-soft: #edf2f7;

      --ink: #10223f;

      --muted: #6b7a90;

      --blue: #1769e0;

      --blue-soft: #e9f2ff;

      --green: #168a62;

      --green-soft: #e6f6f0;

      --orange: #c97b11;

      --orange-soft: #fff3dc;

      --red: #c9423a;

      --red-soft: #fdebe9;

      --shadow: 0 8px 28px rgba(31, 55, 86, 0.07);

      --radius: 18px;

    }



    * {

      box-sizing: border-box;

    }



    body {

      margin: 0;

      min-height: 100vh;

      background: var(--bg);

      color: var(--ink);

      font-family:

        Inter,

        ui-sans-serif,

        system-ui,

        -apple-system,

        BlinkMacSystemFont,

        "Segoe UI",

        sans-serif;

    }



    button,

    select {

      font: inherit;

    }



    .shell {

      max-width: 1680px;

      margin: 0 auto;

      padding: 16px;

    }



    .topbar {

      display: grid;

      grid-template-columns:

        minmax(260px, 1fr)

        auto

        minmax(300px, auto);

      gap: 20px;

      align-items: center;

      background: var(--panel);

      border: 1px solid var(--line);

      border-radius: var(--radius);

      box-shadow: var(--shadow);

      padding: 16px 20px;

    }



    .brand-title {

      display: flex;

      align-items: baseline;

      gap: 10px;

    }



    .brand-title strong {

      font-size: 27px;

      letter-spacing: -0.7px;

    }



    .station-id {

      font-size: 22px;

      color: #405676;

      font-weight: 400;

    }



    .subtitle {

      margin-top: 2px;

      color: var(--muted);

      font-size: 14px;

    }



    .time-block {

      min-width: 260px;

    }



    .time-main {

      font-size: 19px;

      font-weight: 750;

    }



    .time-sub {

      margin-top: 4px;

      color: var(--muted);

      font-size: 13px;

    }



    .status-row {

      display: flex;

      align-items: center;

      gap: 8px;

      margin-top: 7px;

      font-size: 13px;

    }



    .status-dot {

      width: 9px;

      height: 9px;

      border-radius: 50%;

      background: #27ae75;

      box-shadow:

        0 0 0 4px rgba(39, 174, 117, 0.10);

    }



    .status-dot.waiting {

      background: #d99a22;

      box-shadow:

        0 0 0 4px rgba(217, 154, 34, 0.10);

    }



    .status-dot.missing {

      background: #d64b45;

      box-shadow:

        0 0 0 4px rgba(214, 75, 69, 0.10);

    }



    .archive-block {

      display: flex;

      align-items: center;

      justify-content: flex-end;

      gap: 10px;

      min-width: 0;

    }



    .archive-label {

      color: var(--muted);

      font-size: 12px;

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: 0.6px;

    }



    select {

      min-width: 180px;

      border: 1px solid var(--line);

      background: #fff;

      color: var(--ink);

      padding: 9px 12px;

      border-radius: 10px;

      outline: none;

    }



    .dashboard {
      align-items: start;

      display: grid;

      grid-template-columns:

        minmax(0, 1.15fr)

        minmax(420px, 0.85fr);

      gap: 14px;

      margin-top: 14px;

    }



    .panel {

      background: var(--panel);

      border: 1px solid var(--line);

      border-radius: var(--radius);

      box-shadow: var(--shadow);

      overflow: hidden;

    }



    .panel-head {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

      padding: 15px 17px;

      border-bottom: 1px solid var(--line-soft);

    }



    .panel-title {

      font-size: 18px;

      font-weight: 760;

      letter-spacing: -0.2px;

    }



    .panel-note {

      color: var(--muted);

      font-size: 12px;

    }



    .plot-tabs {

      display: flex;

      gap: 6px;

      flex-wrap: wrap;

    }



    .tab-btn {

      border: 1px solid var(--line);

      background: #fff;

      color: #4d607a;

      padding: 7px 10px;

      border-radius: 9px;

      cursor: pointer;

      font-size: 12px;

      font-weight: 650;

    }



    .tab-btn.active {

      border-color: #9fc4fa;

      background: var(--blue-soft);

      color: var(--blue);

    }



    .main-plot {

      min-height: 620px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 10px;

      background: #fff;

    }



    .main-plot img {

      display: block;

      width: 100%;

      max-height: 760px;

      object-fit: contain;

    }



    .image-error {

      display: none;

      padding: 30px;

      color: var(--muted);

      text-align: center;

      font-size: 13px;

    }



    .left-stack,
    .right-stack {

      display: grid;

      gap: 14px;

      align-content: start;

    }



    .metric-grid {

      display: grid;

      grid-template-columns:

        repeat(4, minmax(0, 1fr));

      gap: 8px;

      padding: 12px;

    }



    .metric {

      min-height: 104px;

      padding: 13px;

      border: 1px solid var(--line-soft);

      border-radius: 13px;

      background:

        linear-gradient(

          180deg,

          #ffffff 0%,

          #fbfdff 100%

        );

    }



    .metric-label {

      color: #40516a;

      font-size: 12px;

      font-weight: 700;

    }



    .metric-value {

      display: flex;

      align-items: baseline;

      gap: 5px;

      margin-top: 8px;

    }



    .metric-number {

      font-size: 23px;

      line-height: 1;

      font-weight: 770;

      letter-spacing: -0.5px;

    }



    .metric-unit {

      color: #526985;

      font-size: 13px;

    }



    .percentile-pill {

      display: inline-flex;

      align-items: center;

      margin-top: 9px;

      padding: 3px 7px;

      border-radius: 999px;

      background: var(--blue-soft);

      color: #225da8;

      font-size: 11px;

      font-weight: 750;

    }



    .clim-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px; }
    .clim-summary-item { min-width: 0; padding: 9px; border: 1px solid var(--line-soft); border-radius: 10px; background: #fbfdff; }
    .clim-summary-label { color: #40516a; font-size: 11px; font-weight: 700; }
    .clim-summary-value { margin-top: 5px; font-size: 14px; font-weight: 750; }
    .clim-summary-item .percentile-pill { margin-top: 6px; }
    .clim-summary-action { padding: 0 12px 12px; }
    @media (max-width: 620px) { .clim-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 380px) { .clim-summary { grid-template-columns: 1fr; } }

    .clim-wrap {

      padding: 4px 12px 14px;

    }



    .clim-table {

      width: 100%;

      border-collapse: collapse;

    }



    .clim-table th,

    .clim-table td {

      padding: 8px 7px;

      border-bottom: 1px solid var(--line-soft);

      vertical-align: middle;

      font-size: 12px;

    }



    .clim-table th {

      color: var(--muted);

      font-weight: 700;

      text-align: left;

    }



    .clim-table td.value {

      width: 78px;

      font-weight: 700;

      white-space: nowrap;

    }



    .percentile-cell {

      min-width: 220px;

    }



    .pbar {

      position: relative;

      height: 12px;

      border-radius: 99px;

      background:

        linear-gradient(

          90deg,

          #eef3f9 0%,

          #d7e9ff 25%,

          #c2ddff 50%,

          #d7e9ff 75%,

          #eef3f9 100%

        );

      overflow: visible;

    }



    .pbar::before {

      content: "";

      position: absolute;

      left: 50%;

      top: -2px;

      bottom: -2px;

      width: 1px;

      background: #6480a5;

    }



    .pmark {

      position: absolute;

      top: 50%;

      width: 11px;

      height: 11px;

      border: 2px solid #fff;

      border-radius: 50%;

      background: #102f63;

      box-shadow:

        0 0 0 1px rgba(16, 47, 99, 0.25);

      transform: translate(-50%, -50%);

    }



    .p-caption {

      margin-top: 5px;

      color: var(--muted);

      font-size: 10px;

      display: flex;

      justify-content: space-between;

    }



    .range {

      color: #536985;

      font-size: 11px;

      white-space: nowrap;

    }



    .caveat {

      margin: 10px 12px 13px;

      padding: 10px 12px;

      border-radius: 11px;

      background: #f7f9fc;

      color: #68788d;

      font-size: 11px;

      line-height: 1.45;

    }





    .transport-wrap {

      padding: 12px;

    }



    .transport-grid {

      display: grid;

      grid-template-columns:

        repeat(4, minmax(0, 1fr));

      gap: 8px;

    }



    .transport-card {

      border: 1px solid var(--line-soft);

      border-radius: 12px;

      padding: 11px;

      background: #fbfdff;

      min-width: 0;

    }



    .transport-card-label {

      color: #526985;

      font-size: 11px;

      font-weight: 750;

    }



    .transport-card-value {

      margin-top: 5px;

      font-size: 20px;

      font-weight: 780;

      letter-spacing: -0.4px;

    }



    .transport-card-unit {

      margin-left: 4px;

      color: var(--muted);

      font-size: 11px;

      font-weight: 600;

    }



    .transport-card-sub {

      margin-top: 6px;

      color: var(--muted);

      font-size: 10px;

      line-height: 1.35;

    }



    .humidity-row {

      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      margin-top: 10px;

    }



    .humidity-pill {

      padding: 6px 9px;

      border-radius: 999px;

      background: #f1f5fa;

      color: #40516a;

      font-size: 11px;

      font-weight: 700;

    }



    .orographic-grid {

      display: grid;

      grid-template-columns:

        repeat(2, minmax(0, 1fr));

      gap: 9px;

      padding: 12px;

    }



    .orographic-card {

      border: 1px solid var(--line-soft);

      border-radius: 13px;

      padding: 12px;

      background:

        linear-gradient(

          180deg,

          #ffffff 0%,

          #fbfdff 100%

        );

    }



    .orographic-title {

      font-size: 12px;

      font-weight: 780;

      line-height: 1.3;

    }



    .orographic-layer {

      margin-top: 4px;

      color: var(--muted);

      font-size: 10px;

    }



    .orographic-main {

      margin-top: 10px;

      display: flex;

      align-items: baseline;

      gap: 5px;

    }



    .orographic-number {

      font-size: 25px;

      font-weight: 800;

      letter-spacing: -0.5px;

    }



    .orographic-unit {

      color: #526985;

      font-size: 11px;

    }



    .orographic-caption {

      color: var(--muted);

      font-size: 10px;

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: 0.35px;

    }



    .orographic-meta {

      margin-top: 9px;

      color: #536985;

      font-size: 10px;

      line-height: 1.45;

    }



    .signed-positive {

      color: var(--green);

    }



    .signed-negative {

      color: var(--red);

    }



    .fallback-badge {

      display: inline-block;

      margin-left: 5px;

      padding: 2px 5px;

      border-radius: 999px;

      background: var(--orange-soft);

      color: #8a5c14;

      font-size: 9px;

      font-weight: 750;

      vertical-align: 1px;

    }



    .lower-grid {

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: start;
      gap: 14px;

    }



    .hodo-image {

      padding: 10px;

      min-height: 390px;

      display: flex;

      align-items: center;

      justify-content: center;

    }



    .hodo-image img {

      max-width: 100%;

      max-height: 470px;

      object-fit: contain;

    }



    .table-wrap {

      padding: 10px 12px 14px;

      overflow-x: auto;

    }



    table.data {

      width: 100%;

      border-collapse: collapse;

    }



    table.data th,

    table.data td {

      padding: 8px 7px;

      border-bottom: 1px solid var(--line-soft);

      text-align: left;

      font-size: 12px;

      white-space: nowrap;

    }



    table.data th {

      color: var(--muted);

      font-weight: 700;

    }



    .strength {

      display: inline-block;

      min-width: 64px;

      text-align: center;

      padding: 4px 7px;

      border-radius: 7px;

      font-size: 11px;

      font-weight: 700;

      text-transform: capitalize;

    }



    .strength.weak {

      color: #2b5e91;

      background: #e8f2fd;

    }



    .strength.moderate {

      color: #9a6108;

      background: var(--orange-soft);

    }



    .strength.strong {

      color: #a53a34;

      background: var(--red-soft);

    }



    .change-tabs {

      display: flex;

      gap: 5px;

    }



    .change-tabs button {

      border: 1px solid var(--line);

      border-radius: 8px;

      padding: 6px 10px;

      background: #fff;

      color: #5b6f89;

      cursor: pointer;

      font-size: 11px;

      font-weight: 700;

    }



    .change-tabs button.active {

      color: var(--blue);

      background: var(--blue-soft);

      border-color: #a8c9f7;

    }



    .delta {

      font-weight: 750;

    }



    .delta.positive {

      color: #b64b24;

    }



    .delta.negative {

      color: #1769e0;

    }



    .footer {

      padding: 13px 4px 4px;

      color: #7d8999;

      font-size: 10px;

      text-align: center;

    }



    .loading {

      padding: 80px 20px;

      text-align: center;

      color: var(--muted);

    }



    .error {

      margin: 20px;

      padding: 18px;

      border-radius: 12px;

      color: #9d302b;

      background: #fff0ef;

      border: 1px solid #f4c9c5;

    }



    @media (max-width: 1100px) {

      .topbar {

        grid-template-columns: 1fr;

      }



      .archive-block {

        justify-content: flex-start;

      }



      .dashboard {

        grid-template-columns: 1fr;

      }



      .lower-grid {

        grid-template-columns: 1fr;

      }



      .metric-grid {

        grid-template-columns:

          repeat(2, minmax(0, 1fr));

      }

    }



    @media (max-width: 620px) {

      .shell {

        padding: 8px;

      }



      .metric-grid {

        grid-template-columns: 1fr 1fr;

      }



      .main-plot {

        min-height: 390px;

      }



      .panel-head {

        align-items: flex-start;

        flex-direction: column;

      }



      .archive-block {

        flex-wrap: wrap;

      }



      select {

        width: 100%;

      }

    }

    @media (max-width: 860px) {

      .transport-grid,

      .orographic-grid {

        grid-template-columns:

          repeat(2, minmax(0, 1fr));

      }

    }



    @media (max-width: 520px) {

      .transport-grid,

      .orographic-grid {

        grid-template-columns: 1fr;

      }

    }




    .view-tabs {
      display: flex;
      gap: 8px;
      margin: 0 0 14px;
      padding: 6px;
      width: fit-content;
      max-width: 100%;
      background: #eaf0f7;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .view-tab {
      border: 0;
      background: transparent;
      color: #526985;
      padding: 9px 15px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 750;
    }

    .view-tab.active {
      background: #fff;
      color: var(--blue);
      box-shadow: 0 2px 8px rgba(31, 55, 86, 0.08);
    }

    .comparison-header {
      margin-bottom: 14px;
    }

    .comparison-status {
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-left: 5px solid var(--green);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: var(--shadow);
      font-size: 13px;
      line-height: 1.55;
    }

    .comparison-status.waiting {
      border-left-color: var(--orange);
    }

    .comparison-status.error {
      border-left-color: var(--red);
    }

    .comparison-meta {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 14px;
    }

    .comparison-meta-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 13px;
    }

    .comparison-meta-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.45px;
    }

    .comparison-meta-value {
      margin-top: 5px;
      font-size: 15px;
      font-weight: 760;
      line-height: 1.35;
    }

    .comparison-plots {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .comparison-plot-image {
      min-height: 560px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      background: #fff;
    }

    .comparison-plot-image img {
      display: block;
      width: 100%;
      max-height: 740px;
      object-fit: contain;
    }

    .comparison-metrics {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding: 12px;
    }

    .comparison-metric {
      min-height: 112px;
      padding: 12px;
      border: 1px solid var(--line-soft);
      border-radius: 12px;
      background: #fbfdff;
    }

    .comparison-metric-title {
      color: #40516a;
      font-size: 11px;
      font-weight: 750;
    }

    .comparison-metric-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 6px;
      color: #526985;
      font-size: 11px;
    }

    .comparison-metric-row strong {
      color: var(--ink);
    }

    .comparison-delta {
      margin-top: 8px;
      font-size: 16px;
      font-weight: 800;
    }

    .comparison-rmse {
      display: grid;
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 12px;
    }

    .comparison-table td,
    .comparison-table th {
      text-align: right;
    }

    .comparison-table td:first-child,
    .comparison-table th:first-child {
      text-align: left;
    }

    @media (max-width: 1100px) {
      .comparison-meta,
      .comparison-metrics {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .comparison-plots {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 620px) {
      .view-tabs {
        width: 100%;
      }

      .view-tab {
        flex: 1;
      }

      .comparison-meta,
      .comparison-metrics,
      .comparison-rmse {
        grid-template-columns: 1fr;
      }

      .comparison-plot-image {
        min-height: 390px;
      }
    }

    .view-tabs { flex-wrap: wrap; }
    .extra-diagnostics { padding: 14px; }
    .extra-diagnostics summary { cursor: pointer; color: var(--blue); }
    .potek-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 16px; }
    .potek-controls select { max-width: 100%; padding: 9px; border: 1px solid var(--line); border-radius: 8px; background: white; }
    .potek-chart { padding: 0 16px 16px; }
    .potek-chart svg { display: block; width: 100%; height: auto; min-height: 240px; }
    .potek-chart circle { cursor: pointer; }
    .potek-chart-viewport { max-width: 1000px; margin: 0 auto; overflow-x: auto; overscroll-behavior-x: contain; }
    .potek-chart-inner { width: 100%; min-width: 680px; }
    .potek-chart-inner svg { min-height: 0; }
    .potek-chart { min-width: 0; max-width: 100%; }
    .potek-legend { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 auto 14px; max-width: 1000px; color: #526985; font-size: 11px; }
    .potek-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .potek-legend i { width: 18px; height: 12px; border-radius: 3px; }
    .heat-low { background: #568bb7; }
    .heat-lower { background: #bdd5e8; }
    .heat-normal { background: #e9edf0; }
    .heat-upper { background: #ead0ac; }
    .heat-high { background: #bf8053; }
    .heat-missing { background: #fafbfd; border: 1px dashed #d9e1ea !important; }
    .potek-heatmap { display: grid; gap: 4px; padding-bottom: 8px; }
    .heat-label { position: sticky; left: 0; z-index: 1; background: #fff; padding: 10px 8px; font-size: 12px; font-weight: 700; box-shadow: 4px 0 5px rgba(255,255,255,.9); }
    .heat-group { grid-column: 1 / -1; border-top: 1px solid var(--line-soft); background: #f7f9fc; }
    .heat-group span { display: inline-block; position: sticky; left: 0; padding: 6px 8px; color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: .3px; }
    .heat-cell { border: 0; border-radius: 5px; min-height: 40px; padding: 0; cursor: pointer; }
    .heat-cell:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
    .heat-time { font-size: 10px; color: #526985; text-align: center; padding: 8px 0; white-space: pre-line; }
    @media (pointer: coarse) { .potek-chart-inner [data-point] { r: 18px; } }
    @media (max-width: 620px) { .potek-chart { padding: 0 8px 12px; } .heat-label { font-size: 11px; } }
    .potek-note { padding: 12px 16px; color: #526985; font-size: 13px; }
  </style>

</head>



<body>

  <div class="shell">

    <div class="view-tabs" aria-label="Dashboard view">
      <button
        id="viewSoundingBtn"
        class="view-tab active"
        type="button"
        onclick="showSoundingView()"
      >
        Sounding
      </button>

      <button
        id="viewComparisonBtn"
        class="view-tab"
        type="button"
        onclick="showComparisonView()"
      >
        ICON-D2 +12 h
      </button>
      <button id="viewTimeseriesBtn" class="view-tab" type="button"
        onclick="showTimeseriesView()">Time series</button>
      <button id="viewClimatologyBtn" class="view-tab" type="button"
        onclick="showClimatologyView()">Climatology</button>
      <button id="viewTrajectoriesBtn" class="view-tab" type="button" onclick="showTrajectoriesView()">Trajectories</button>
    </div>

    <div id="app">

      <div class="loading">

        Loading LJLM sounding …

      </div>

    </div>

  </div>



  <script>

    let currentData = null;
    let dashboardPending = false;
    let climatologyMode = 'annual';

    let currentPlot = 'zoom';

    let currentChange = '24h';

    let currentView = 'sounding';

    let currentComparePlot = 'overlay';



    function esc(value) {

      return String(

        value === null ||

        value === undefined

          ? ''

          : value

      )

        .replace(/&/g, '&amp;')

        .replace(/</g, '&lt;')

        .replace(/>/g, '&gt;')

        .replace(/"/g, '&quot;')

        .replace(/'/g, '&#039;');

    }



    function fmt(value, digits) {

      if (

        value === null ||

        value === undefined ||

        !Number.isFinite(Number(value))

      ) {

        return '—';

      }



      const n = Number(value);



      return n.toLocaleString(

        'en-GB',

        {

          minimumFractionDigits:

            digits || 0,

          maximumFractionDigits:

            digits || 0

        }

      );

    }



    function smartFmt(value, unit) {

      if (

        value === null ||

        value === undefined ||

        !Number.isFinite(Number(value))

      ) {

        return '—';

      }



      if (

        unit === '°C' ||

        unit === '°C/km' ||

        unit === 'm/s' ||

        unit === 'mm' ||

        unit === 'g/kg'

      ) {

        return fmt(value, 1);

      }



      if (

        unit === 'kg m⁻¹ s⁻¹' ||

        unit === 'J/kg'

      ) {

        return fmt(value, 0);

      }



      return fmt(value, 0);

    }



    function utcLabel(text) {

      if (!text) {

        return '—';

      }



      return text

        .replace('T', ' ')

        .replace('Z', ' UTC');

    }



    function statusLabel(status) {

      const s =

        String(status || 'ok')

          .toLowerCase();



      if (s === 'waiting') {

        return 'WAITING';

      }



      if (s === 'missing') {

        return 'MISSING';

      }



      return 'OK';

    }



    function metricHtml(item) {

      const percentile = percentileBadge_(item.percentile);

      return (

        '<div class="metric">' +

          '<div class="metric-label">' +

            esc(item.label) +

          '</div>' +

          '<div class="metric-value">' +

            '<span class="metric-number">' +

              smartFmt(

                item.value,

                item.unit

              ) +

            '</span>' +

            '<span class="metric-unit">' +

              esc(item.unit) +

            '</span>' +

          '</div>' +

          percentile +

        '</div>'

      );

    }





    function moistureTransportHtml(data) {

      const block =

        data.moistureTransport || {};



      if (!block.available) {

        return (

          '<div class="caveat">' +

            (

              block.error

                ? (

                    'Moisture transport unavailable: ' +

                    esc(block.error)

                  )

                : 'Moisture transport not available.'

            ) +

          '</div>'

        );

      }



      const cards = [];



      if (

        block.total &&

        block.total.available

      ) {

        cards.push(

          '<div class="transport-card">' +

            '<div class="transport-card-label">' +

              'Total IVT' +

            '</div>' +

            '<div class="transport-card-value">' +

              smartFmt(

                block.total.magnitude,

                'kg m⁻¹ s⁻¹'

              ) +

              '<span class="transport-card-unit">' +

                'kg m⁻¹ s⁻¹' +

              '</span>' +

            '</div>' +

            '<div class="transport-card-sub">' +

              (

                block.total.direction !== null

                  ? (

                      'toward ' +

                      fmt(

                        block.total.direction,

                        0

                      ) +

                      '°'

                    )

                  : ''

              ) +

            '</div>' +

          '</div>'

        );

      }



      (block.layers || [])

        .filter(function(item) {

          return item.available;

        })

        .forEach(function(item) {

          cards.push(

            '<div class="transport-card">' +

              '<div class="transport-card-label">' +

                esc(item.label) +

              '</div>' +

              '<div class="transport-card-value">' +

                smartFmt(

                  item.magnitude,

                  'kg m⁻¹ s⁻¹'

                ) +

                '<span class="transport-card-unit">' +

                  'kg m⁻¹ s⁻¹' +

                '</span>' +

              '</div>' +

              '<div class="transport-card-sub">' +

                (

                  item.direction !== null

                    ? (

                        'toward ' +

                        fmt(item.direction, 0) +

                        '°'

                      )

                    : ''

                ) +

              '</div>' +

            '</div>'

          );

        });



      const humidity =

        (block.humidity || [])

          .filter(function(item) {

            return item.value !== null;

          })

          .map(function(item) {

            return (

              '<span class="humidity-pill">' +

                esc(item.label) +

                ' ' +

                smartFmt(

                  item.value,

                  'g/kg'

                ) +

                ' g/kg' +

              '</span>'

            );

          })

          .join('');



      return (

        '<div class="transport-wrap">' +

          '<div class="transport-grid">' +

            cards.join('') +

          '</div>' +

          (

            humidity

              ? (

                  '<div class="humidity-row">' +

                    humidity +

                  '</div>'

                )

              : ''

          ) +

        '</div>'

      );

    }





    function orographicTransportHtml(data) {

      const block =

        data.orographicTransport || {};



      if (

        !block.available ||

        !block.rows ||

        !block.rows.length

      ) {

        return (

          '<div class="caveat">' +

          'Orographic moisture transport not available.' +

          '</div>'

        );

      }



      const cards =

        block.rows.map(

          function(item) {

            const signedClass =

              item.signed === null

                ? ''

                : (

                    item.signed >= 0

                      ? 'signed-positive'

                      : 'signed-negative'

                  );



            const fallback =

              item.mode === 'pressure_fallback'

                ? (

                    '<span class="fallback-badge">' +

                    'pressure fallback' +

                    '</span>'

                  )

                : '';



            return (

              '<div class="orographic-card">' +

                '<div class="orographic-title">' +

                  esc(item.label) +

                '</div>' +



                '<div class="orographic-layer">' +

                  esc(item.layerLabel) +

                  fallback +

                  (

                    item.normalAzimuth !== null

                      ? (

                          ' · normal ' +

                          fmt(

                            item.normalAzimuth,

                            0

                          ) +

                          '°'

                        )

                      : ''

                  ) +

                '</div>' +



                '<div class="orographic-main">' +

                  '<span class="orographic-number ' + signedClass + '">' +

                    smartFmt(

                      item.signed,

                      'kg m⁻¹ s⁻¹'

                    ) +

                  '</span>' +

                  '<span class="orographic-unit">' +

                    'kg m⁻¹ s⁻¹' +

                  '</span>' +

                '</div>' +



                '<div class="orographic-caption">' +

                  'cross-barrier IVT⊥' +

                '</div>' +



                '<div class="orographic-meta">' +

                  'signed fraction: ' +

                  (

                    item.fractionPct !== null

                      ? (

                          fmt(

                            item.fractionPct,

                            0

                          ) +

                          '%'

                        )

                      : '—'

                  ) +

                  (

                    item.angleDeg !== null

                      ? (

                          ' · angle: ' +

                          fmt(

                            item.angleDeg,

                            0

                          ) +

                          '°'

                        )

                      : ''

                  ) +

                  (

                    item.topPressure !== null

                      ? (

                          '<br>layer top ≈ ' +

                          fmt(

                            item.topPressure,

                            0

                          ) +

                          ' hPa'

                        )

                      : ''

                  ) +

                '</div>' +

              '</div>'

            );

          }

        ).join('');



      return (

        '<div class="orographic-grid">' +

          cards +

        '</div>' +

        '<div class="caveat">' +

          'Positive transport is toward the selected upslope normal. ' +

          'Negative transport is in the opposite direction. ' +

          (

            block.version !== null

              ? (

                  'Orographic diagnostic v' +

                  esc(block.version) +

                  '.'

                )

              : ''

          ) +

        '</div>'

      );

    }





    function percentileBadge_(value) {
      return typeof value === 'number' && Number.isFinite(value)
        ? '<div class="percentile-pill">P' + Math.round(value) + '</div>'
        : '';
    }

    function climatologyHtml(data) {
      const definitions = [
        ['t850', 'T850'], ['pwat_mm', 'PWAT'],
        ['freezing_level_msl_m', 'Freezing level'], ['lifted_index_c', 'Lifted Index'],
        ['shear_0_6km_ms', '0–6 km shear'], ['z500_m', 'Z500']
      ];
      const items = definitions.map(function(definition) {
        const item = (data.climatology || []).find(function(entry) { return entry.key === definition[0]; });
        if (!item || typeof item.value !== 'number' || !Number.isFinite(item.value)) return '';
        return '<div class="clim-summary-item">' +
          '<div class="clim-summary-label">' + esc(definition[1]) + '</div>' +
          '<div class="clim-summary-value">' + smartFmt(item.value, item.unit) + ' ' + esc(item.unit) + '</div>' +
          percentileBadge_(item.percentile) + '</div>';
      }).join('');
      return (items ? '<div class="clim-summary">' + items + '</div>'
        : '<div class="caveat">Climatology not available.</div>') +
        '<div class="clim-summary-action"><button type="button" class="tab-btn" onclick="showClimatologyView()">Open Climatology →</button></div>';
    }


    function inversionHtml(data) {

      const rows =

        (data.inversions || [])

          .map(function(item) {

            return (

              '<tr>' +

                '<td>' +

                  fmt(item.baseAglM, 0) +

                  ' m' +

                '</td>' +

                '<td>' +

                  fmt(item.topAglM, 0) +

                  ' m' +

                '</td>' +

                '<td>' +

                  fmt(item.depthM, 0) +

                  ' m' +

                '</td>' +

                '<td>' +

                  (

                    item.deltaTC !== null

                      ? (

                        (item.deltaTC >= 0 ? '+' : '') +

                        fmt(item.deltaTC, 2) +

                        ' °C'

                      )

                      : '—'

                  ) +

                '</td>' +

                '<td>' +

                  '<span class="strength ' +

                    esc(item.strength) +

                  '">' +

                    esc(

                      item.strength ||

                      '—'

                    ) +

                  '</span>' +

                '</td>' +

              '</tr>'

            );

          })

          .join('');



      if (!rows) {

        return (

          '<div class="caveat">' +

          'No inversion diagnostics available.' +

          '</div>'

        );

      }



      return (

        '<div class="table-wrap">' +

          '<table class="data">' +

            '<thead>' +

              '<tr>' +

                '<th>Base AGL</th>' +

                '<th>Top AGL</th>' +

                '<th>Depth</th>' +

                '<th>ΔT</th>' +

                '<th>Strength</th>' +

              '</tr>' +

            '</thead>' +

            '<tbody>' +

              rows +

            '</tbody>' +

          '</table>' +

        '</div>'

      );

    }



    function changeBlock(data) {

      const block =

        currentChange === '12h'

          ? data.changes.previousTerm

          : data.changes.previousDay;



      if (

        !block ||

        !block.available

      ) {

        return (

          '<div class="caveat">' +

          'Comparison not available.' +

          '</div>'

        );

      }



      const rows =

        block.rows.map(

          function(item) {

            let cls = '';



            if (

              item.delta !== null

            ) {

              cls =

                item.delta > 0

                  ? 'positive'

                  : (

                    item.delta < 0

                      ? 'negative'

                      : ''

                  );

            }



            const delta =

              item.delta === null

                ? '—'

                : (

                    (

                      item.delta > 0

                        ? '+'

                        : ''

                    ) +

                    smartFmt(

                      item.delta,

                      item.unit

                    ) +

                    ' ' +

                    esc(item.unit)

                  );



            return (

              '<tr>' +

                '<td><strong>' +

                  esc(item.label) +

                '</strong></td>' +

                '<td>' +

                  smartFmt(

                    item.current,

                    item.unit

                  ) +

                  ' ' +

                  esc(item.unit) +

                '</td>' +

                '<td>' +

                  smartFmt(

                    item.previous,

                    item.unit

                  ) +

                  ' ' +

                  esc(item.unit) +

                '</td>' +

                '<td class="delta ' +

                  cls +

                '">' +

                  delta +

                '</td>' +

              '</tr>'

            );

          }

        ).join('');



      return (

        '<div class="table-wrap">' +

          '<table class="data">' +

            '<thead>' +

              '<tr>' +

                '<th>Parameter</th>' +

                '<th>Current</th>' +

                '<th>Previous</th>' +

                '<th>Change</th>' +

              '</tr>' +

            '</thead>' +

            '<tbody>' +

              rows +

            '</tbody>' +

          '</table>' +

        '</div>'

      );

    }



    function plotUrl(data) {

      if (currentPlot === 'full') {

        return data.images.skewt;

      }



      if (currentPlot === 'thetae') {

        return data.images.thetae;

      }



      return data.images.skewtZoom;

    }



    function plotTitle() {

      if (currentPlot === 'full') {

        return 'Full Skew-T';

      }



      if (currentPlot === 'thetae') {

        return 'θe / θ profile';

      }



      return 'Low-level profile';

    }



    function archiveOptionsHtml(data) {

      const options = [];



      const latestSelected =

        data.profilePath === 'data/latest.json';



      options.push(

        '<option value=""' +

          (

            latestSelected

              ? ' selected'

              : ''

          ) +

        '>' +

          'Latest · ' +

          esc(

            data.nominalDate +

            ' · ' +

            data.term +

            ' UTC'

          ) +

        '</option>'

      );



      (data.archiveOptions || [])

        .forEach(function(item) {

          const selected =

            item.archiveFile ===

            data.profilePath;



          options.push(

            '<option value="' +

              esc(item.archiveFile) +

            '"' +

              (

                selected

                  ? ' selected'

                  : ''

              ) +

            '>' +

              esc(

                item.nominalDate +

                ' · ' +

                item.term +

                ' UTC'

              ) +

            '</option>'

          );

        });



      return options.join('');

    }



    function render(data) {

      if (currentView !== 'sounding') return;

      currentData = data;



      const status =

        String(

          data.soundingStatus || 'ok'

        ).toLowerCase();



      const html =

        '<header class="topbar">' +



          '<div>' +

            '<div class="brand-title">' +

              '<strong>' +

                esc(

                  String(

                    data.stationName ||

                    'Ljubljana'

                  ).toUpperCase()

                ) +

              '</strong>' +

              '<span class="station-id">' +

                esc(data.station) +

              '</span>' +

            '</div>' +

            '<div class="subtitle">' +

              'Upper-air sounding' +

            '</div>' +

          '</div>' +



          '<div class="time-block">' +

            '<div class="time-main">' +

              esc(data.nominalDate) +

              ' · ' +

              esc(data.term) +

              ' UTC' +

            '</div>' +



            '<div class="time-sub">' +

              'Launch: ' +

              esc(

                utcLabel(

                  data.launchTime

                )

              ) +

            '</div>' +



            '<div class="status-row">' +

              '<span class="status-dot ' +

                esc(status) +

              '"></span>' +

              '<strong>' +

                esc(

                  statusLabel(status)

                ) +

              '</strong>' +

              '<span class="time-sub">' +

                'Processed ' +

                esc(

                  utcLabel(

                    data.processedAt

                  )

                ) +

              '</span>' +

            '</div>' +

          '</div>' +



          '<div class="archive-block">' +

            '<span class="archive-label">' +

              'Archive' +

            '</span>' +

            '<select id="archiveSelect">' +

              archiveOptionsHtml(data) +

            '</select>' +

          '</div>' +



        '</header>' +



        '<main class="dashboard">' +



          '<div class="left-stack">' +
          '<section class="panel">' +

            '<div class="panel-head">' +

              '<div>' +

                '<div class="panel-title" id="plotTitle">' +

                  esc(plotTitle()) +

                '</div>' +

                '<div class="panel-note">' +

                  'Static MetPy product · wind in kt' +

                '</div>' +

              '</div>' +



              '<div class="plot-tabs">' +

                '<button class="tab-btn ' +

                  (

                    currentPlot === 'zoom'

                      ? 'active'

                      : ''

                  ) +

                  '" data-plot="zoom">' +

                  'Low level' +

                '</button>' +



                '<button class="tab-btn ' +

                  (

                    currentPlot === 'full'

                      ? 'active'

                      : ''

                  ) +

                  '" data-plot="full">' +

                  'Full Skew-T' +

                '</button>' +



                '<button class="tab-btn ' +

                  (

                    currentPlot === 'thetae'

                      ? 'active'

                      : ''

                  ) +

                  '" data-plot="thetae">' +

                  'θe / θ' +

                '</button>' +

              '</div>' +

            '</div>' +



            '<div class="main-plot">' +

              '<img id="mainPlotImage" ' +

                'src="' +

                  esc(

                    plotUrl(data)

                  ) +

                '" ' +

                'alt="LJLM sounding">' +



              '<div id="mainPlotError" ' +

                'class="image-error">' +

                'Image is not available for this archived sounding.' +

              '</div>' +

            '</div>' +

          '</section>' +



          '<div class="lower-grid">' +
            '<section class="panel">' +

              '<div class="panel-head">' +

                '<div class="panel-title">' +

                  'Hodograph' +

                '</div>' +

                '<div class="panel-note">' +

                  '0–12 km AGL' +

                '</div>' +

              '</div>' +



              '<div class="hodo-image">' +

                '<img src="' +

                  esc(

                    data.images.hodograph

                  ) +

                '" alt="LJLM hodograph">' +

              '</div>' +

            '</section>' +



            '<section class="panel">' +

              '<div class="panel-head">' +

                '<div class="panel-title">' +

                  'Inversions' +

                '</div>' +

                '<div class="panel-note">' +

                  'Detected layers' +

                '</div>' +

              '</div>' +



              inversionHtml(data) +



            '</section>' +



          '</div></div>' +
          '<div class="right-stack">' +



            '<section class="panel">' +

              '<div class="panel-head">' +

                '<div class="panel-title">' +

                  'Current state' +

                '</div>' +

                '<div class="panel-note">' +

                  'Current sounding' +

                '</div>' +

              '</div>' +



              '<div class="metric-grid">' +

                data.metrics

                  .map(metricHtml)

                  .join('') +

              '</div>' +
              '<details class="extra-diagnostics"><summary>Additional diagnostics · Lifted Index, CAPE/CIN, shear, lapse rates</summary>' +
                '<div class="metric-grid">' + (data.additionalDiagnostics || []).map(metricHtml).join('') + '</div>' +

      const start = trajectoryCoordinate_(t.start) ? t.start : t.points.find(trajectoryCoordinate_);
      const end = points.length ? points[points.length-1] : {};
      const stats = [['Elapsed time',trajectoryTime_(end.time_s)],['Endpoint pressure',fmt(end.pressure_hpa,1)+' hPa'],['Endpoint height',fmt(end.height_m,0)+' m MSL'],['Displacement from launch',fmt(trajectoryDisplacement_(start,end),1)+' km']];
      app.innerHTML = '<section class="panel"><div class="panel-head"><div class="panel-title">Trajectories · LJLM</div><div class="panel-note">' + esc(currentData.nominalDate+' · '+currentData.term+' UTC') + '</div></div><div class="trajectory-body">' + trajectoryToolbar_() + '<div class="trajectory-controls" aria-label="Trajectory segment">' +
        [['full','Full ascent'],['10','10 min'],['20','20 min'],['850','850 hPa'],['700','700 hPa'],['500','500 hPa']].map(item => '<button type="button" class="tab-btn '+(trajectorySegment===item[0]?'active':'')+'" aria-pressed="'+(trajectorySegment===item[0])+'" onclick="selectTrajectorySegment_(\''+item[0]+'\')">'+item[1]+'</button>').join('') + '</div><div class="trajectory-summary">' +
        stats.map(item => '<div class="trajectory-stat"><span>'+item[0]+'</span><strong>'+item[1]+'</strong></div>').join('') + '</div><div id="trajectoryMap" class="trajectory-map" role="region" aria-label="Interactive radiosonde ascent map"></div><div class="trajectory-legend"><span><i style="background:#16806a"></i>Launch</span><span><i style="background:#c9423a"></i>Segment endpoint</span><span><i style="background:#436da8"></i>Standard pressure levels</span></div></div></section>';
      if (!points.length) { document.getElementById('trajectoryMap').textContent = 'No trajectory points in this segment'; return; }
      if (typeof L === 'undefined') {
        document.getElementById('trajectoryMap').innerHTML = '<div class="caveat">Map could not load. <button class="tab-btn" onclick="showTrajectoriesView()">Try again</button></div>';
        return;
      }
      trajectoryMap = L.map('trajectoryMap');
      updateTrajectoryBasemap_();
      const coordinates = points.map(p => [p.latitude,p.longitude]);
      L.polyline(coordinates,{color:'#245eaa',weight:3.5,opacity:0.95}).addTo(trajectoryMap);
      [925,850,700,500,300,250,200].forEach(level => {
        const p = (t.standardLevels || {})[level];
        if (!trajectoryCoordinate_(p) || !Number.isFinite(p.time_s) || p.time_s > end.time_s) return;
        L.circleMarker([p.latitude,p.longitude],{radius:4,color:'#436da8',weight:1.5,fillColor:'#fff',fillOpacity:1}).addTo(trajectoryMap)
          .bindTooltip(trajectoryPointLabel_(p,level+' hPa')).bindPopup(trajectoryPointLabel_(p,level+' hPa'));
      });
      [[start,'Launch','#16806a'],[end,'Segment endpoint','#c9423a']].forEach(item => {
        L.circleMarker([item[0].latitude,item[0].longitude],{radius:6,color:'#fff',weight:2,fillColor:item[2],fillOpacity:1}).addTo(trajectoryMap)
          .bindTooltip(item[1]).bindPopup(trajectoryPointLabel_(item[0],item[1]));
      });
      coordinates.push([start.latitude,start.longitude]);
      trajectoryMap.invalidateSize();
      trajectoryMap.fitBounds(L.latLngBounds(coordinates),{padding:[30,30],maxZoom:13});
      if (typeof ResizeObserver !== 'undefined') {
        trajectoryResizeObserver = new ResizeObserver(() => { if (trajectoryMap) trajectoryMap.invalidateSize(); });
        trajectoryResizeObserver.observe(document.getElementById('trajectoryMap'));
      }
    }

      value,
      unit

        value === null ||

        !Number.isFinite(Number(value))

      }

      const n = Number(value);
      const valueText =
        smartFmt(n, unit);

      return (
        n > 0
          ? '+' + valueText
          : valueText
      );

    const timeseriesCache = Object.create(null);

      pwat_mm: ['PWAT', 'mm'],

    };
    [['dinaric_west', 'Dinaric west'], ['julian_south', 'Julian south'],
      ['julian_central', 'Julian central'], ['kamnik_savinja', 'Kamnik–Savinja']]
      .forEach(function(barrier) {
        timeseriesDefinitions[barrier[0] + '_signed_ivt'] = [barrier[1] + ' · signed IVT', 'kg m⁻¹ s⁻¹'];
        timeseriesDefinitions[barrier[0] + '_signed_fraction'] = [barrier[1] + ' · signed fraction', '%'];
