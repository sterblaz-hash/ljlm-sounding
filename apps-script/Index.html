<!DOCTYPE html>

<html lang="en">

<head>

  <base target="_top">



  <style>

    :root {

      --bg: #f3f7fb;

      --panel: #ffffff;

      --line: #dfe7f0;

      --line-soft: #edf2f7;

      --ink: #10223f;

      --muted: #6b7a90;

      --blue: #1769e0;

      --blue-soft: #e9f2ff;

      --green: #168a62;

      --green-soft: #e6f6f0;

      --orange: #c97b11;

      --orange-soft: #fff3dc;

      --red: #c9423a;

      --red-soft: #fdebe9;

      --shadow: 0 8px 28px rgba(31, 55, 86, 0.07);

      --radius: 18px;

    }



    * {

      box-sizing: border-box;

    }



    body {

      margin: 0;

      min-height: 100vh;

      background: var(--bg);

      color: var(--ink);

      font-family:

        Inter,

        ui-sans-serif,

        system-ui,

        -apple-system,

        BlinkMacSystemFont,

        "Segoe UI",

        sans-serif;

    }



    button,

    select {

      font: inherit;

    }



    .shell {

      max-width: 1680px;

      margin: 0 auto;

      padding: 16px;

    }



    .topbar {

      display: grid;

      grid-template-columns:

        minmax(260px, 1fr)

        auto

        minmax(300px, auto);

      gap: 20px;

      align-items: center;

      background: var(--panel);

      border: 1px solid var(--line);

      border-radius: var(--radius);

      box-shadow: var(--shadow);

      padding: 16px 20px;

    }



    .brand-title {

      display: flex;

      align-items: baseline;

      gap: 10px;

    }



    .brand-title strong {

      font-size: 27px;

      letter-spacing: -0.7px;

    }



    .station-id {

      font-size: 22px;

      color: #405676;

      font-weight: 400;

    }



    .subtitle {

      margin-top: 2px;

      color: var(--muted);

      font-size: 14px;

    }



    .time-block {

      min-width: 260px;

    }



    .time-main {

      font-size: 19px;

      font-weight: 750;

    }



    .time-sub {

      margin-top: 4px;

      color: var(--muted);

      font-size: 13px;

    }



    .status-row {

      display: flex;

      align-items: center;

      gap: 8px;

      margin-top: 7px;

      font-size: 13px;

    }



    .status-dot {

      width: 9px;

      height: 9px;

      border-radius: 50%;

      background: #27ae75;

      box-shadow:

        0 0 0 4px rgba(39, 174, 117, 0.10);

    }



    .status-dot.waiting {

      background: #d99a22;

      box-shadow:

        0 0 0 4px rgba(217, 154, 34, 0.10);

    }



    .status-dot.missing {

      background: #d64b45;

      box-shadow:

        0 0 0 4px rgba(214, 75, 69, 0.10);

    }



    .archive-block {

      display: flex;

      align-items: center;

      justify-content: flex-end;

      gap: 10px;

      min-width: 0;

    }



    .archive-label {

      color: var(--muted);

      font-size: 12px;

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: 0.6px;

    }



    select {

      min-width: 180px;

      border: 1px solid var(--line);

      background: #fff;

      color: var(--ink);

      padding: 9px 12px;

      border-radius: 10px;

      outline: none;

    }



    .dashboard {
      align-items: start;

      display: grid;

      grid-template-columns:

        minmax(0, 1.15fr)

        minmax(420px, 0.85fr);

      gap: 14px;

      margin-top: 14px;

    }



    .panel {

      background: var(--panel);

      border: 1px solid var(--line);

      border-radius: var(--radius);

      box-shadow: var(--shadow);

      overflow: hidden;

    }



    .panel-head {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

      padding: 15px 17px;

      border-bottom: 1px solid var(--line-soft);

    }



    .panel-title {

      font-size: 18px;

      font-weight: 760;

      letter-spacing: -0.2px;

    }



    .panel-note {

      color: var(--muted);

      font-size: 12px;

    }



    .plot-tabs {

      display: flex;

      gap: 6px;

      flex-wrap: wrap;

    }



    .tab-btn {

      border: 1px solid var(--line);

      background: #fff;

      color: #4d607a;

      padding: 7px 10px;

      border-radius: 9px;

      cursor: pointer;

      font-size: 12px;

      font-weight: 650;

    }



    .tab-btn.active {

      border-color: #9fc4fa;

      background: var(--blue-soft);

      color: var(--blue);

    }



    .main-plot {

      min-height: 620px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 10px;

      background: #fff;

    }



    .main-plot img {

      display: block;

      width: 100%;

      max-height: 760px;

      object-fit: contain;

    }



    .image-error {

      display: none;

      padding: 30px;

      color: var(--muted);

      text-align: center;

      font-size: 13px;

    }



    .left-stack,
    .right-stack {

      display: grid;

      gap: 14px;

      align-content: start;

    }



    .metric-grid {

      display: grid;

      grid-template-columns:

        repeat(4, minmax(0, 1fr));

      gap: 8px;

      padding: 12px;

    }



    .metric {

      min-height: 104px;

      padding: 13px;

      border: 1px solid var(--line-soft);

      border-radius: 13px;

      background:

        linear-gradient(

          180deg,

          #ffffff 0%,

          #fbfdff 100%

        );

    }



    .metric-label {

      color: #40516a;

      font-size: 12px;

      font-weight: 700;

    }



    .metric-value {

      display: flex;

      align-items: baseline;

      gap: 5px;

      margin-top: 8px;

    }



    .metric-number {

      font-size: 23px;

      line-height: 1;

      font-weight: 770;

      letter-spacing: -0.5px;

    }



    .metric-unit {

      color: #526985;

      font-size: 13px;

    }



    .percentile-pill {

      display: inline-flex;

      align-items: center;

      margin-top: 9px;

      padding: 3px 7px;

      border-radius: 999px;

      background: var(--blue-soft);

      color: #225da8;

      font-size: 11px;

      font-weight: 750;

    }



    .clim-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px; }
    .clim-summary-item { min-width: 0; padding: 9px; border: 1px solid var(--line-soft); border-radius: 10px; background: #fbfdff; }
    .clim-summary-label { color: #40516a; font-size: 11px; font-weight: 700; }
    .clim-summary-value { margin-top: 5px; font-size: 14px; font-weight: 750; }
    .clim-summary-item .percentile-pill { margin-top: 6px; }
    .clim-summary-action { padding: 0 12px 12px; }
    @media (max-width: 620px) { .clim-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 380px) { .clim-summary { grid-template-columns: 1fr; } }

    .clim-wrap {

      padding: 4px 12px 14px;

    }



    .clim-table {

      width: 100%;

      border-collapse: collapse;

    }



    .clim-table th,

    .clim-table td {

      padding: 8px 7px;

      border-bottom: 1px solid var(--line-soft);

      vertical-align: middle;

      font-size: 12px;

    }



    .clim-table th {

      color: var(--muted);

      font-weight: 700;

      text-align: left;

    }



    .clim-table td.value {

      width: 78px;

      font-weight: 700;

      white-space: nowrap;

    }



    .percentile-cell {

      min-width: 220px;

    }



    .pbar {

      position: relative;

      height: 12px;

      border-radius: 99px;

      background:

        linear-gradient(

          90deg,

          #eef3f9 0%,

          #d7e9ff 25%,

          #c2ddff 50%,

          #d7e9ff 75%,

          #eef3f9 100%

        );

      overflow: visible;

    }



    .pbar::before {

      content: "";

      position: absolute;

      left: 50%;

      top: -2px;

      bottom: -2px;

      width: 1px;

      background: #6480a5;

    }



    .pmark {

      position: absolute;

      top: 50%;

      width: 11px;

      height: 11px;

      border: 2px solid #fff;

      border-radius: 50%;

      background: #102f63;

      box-shadow:

        0 0 0 1px rgba(16, 47, 99, 0.25);

      transform: translate(-50%, -50%);

    }



    .p-caption {

      margin-top: 5px;

      color: var(--muted);

      font-size: 10px;

      display: flex;

      justify-content: space-between;

    }



    .range {

      color: #536985;

      font-size: 11px;

      white-space: nowrap;

    }



    .caveat {

      margin: 10px 12px 13px;

      padding: 10px 12px;

      border-radius: 11px;

      background: #f7f9fc;

      color: #68788d;

      font-size: 11px;

      line-height: 1.45;

    }





    .transport-wrap {

      padding: 12px;

    }



    .transport-grid {

      display: grid;

      grid-template-columns:

        repeat(4, minmax(0, 1fr));

      gap: 8px;

    }



    .transport-card {

      border: 1px solid var(--line-soft);

      border-radius: 12px;

      padding: 11px;

      background: #fbfdff;

      min-width: 0;

    }



    .transport-card-label {

      color: #526985;

      font-size: 11px;

      font-weight: 750;

    }



    .transport-card-value {

      margin-top: 5px;

      font-size: 20px;

      font-weight: 780;

      letter-spacing: -0.4px;

    }



    .transport-card-unit {

      margin-left: 4px;

      color: var(--muted);

      font-size: 11px;

      font-weight: 600;

    }



    .transport-card-sub {

      margin-top: 6px;

      color: var(--muted);

      font-size: 10px;

      line-height: 1.35;

    }



    .humidity-row {

      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      margin-top: 10px;

    }



    .humidity-pill {

      padding: 6px 9px;

      border-radius: 999px;

      background: #f1f5fa;

      color: #40516a;

      font-size: 11px;

      font-weight: 700;

    }



    .orographic-grid {

      display: grid;

      grid-template-columns:

        repeat(2, minmax(0, 1fr));

      gap: 9px;

      padding: 12px;

    }



    .orographic-card {

      border: 1px solid var(--line-soft);

      border-radius: 13px;

      padding: 12px;

      background:

        linear-gradient(

          180deg,

          #ffffff 0%,

          #fbfdff 100%

        );

    }



    .orographic-title {

      font-size: 12px;

      font-weight: 780;

      line-height: 1.3;

    }



    .orographic-layer {

      margin-top: 4px;

      color: var(--muted);

      font-size: 10px;

    }



    .orographic-main {

      margin-top: 10px;

      display: flex;

      align-items: baseline;

      gap: 5px;

    }



    .orographic-number {

      font-size: 25px;

      font-weight: 800;

      letter-spacing: -0.5px;

    }



    .orographic-unit {

      color: #526985;

      font-size: 11px;

    }



    .orographic-caption {

      color: var(--muted);

      font-size: 10px;

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: 0.35px;

    }



    .orographic-meta {

      margin-top: 9px;

      color: #536985;

      font-size: 10px;

      line-height: 1.45;

    }



    .signed-positive {

      color: var(--green);

    }



    .signed-negative {

      color: var(--red);

    }



    .fallback-badge {

      display: inline-block;

      margin-left: 5px;

      padding: 2px 5px;

      border-radius: 999px;

      background: var(--orange-soft);

      color: #8a5c14;

      font-size: 9px;

      font-weight: 750;

      vertical-align: 1px;

    }



    .lower-grid {

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: start;
      gap: 14px;

    }



    .hodo-image {

      padding: 10px;

      min-height: 390px;

      display: flex;

      align-items: center;

      justify-content: center;

    }



    .hodo-image img {

      max-width: 100%;

      max-height: 470px;

      object-fit: contain;

    }



    .table-wrap {

      padding: 10px 12px 14px;

      overflow-x: auto;

    }



    table.data {

      width: 100%;

      border-collapse: collapse;

    }



    table.data th,

    table.data td {

      padding: 8px 7px;

      border-bottom: 1px solid var(--line-soft);

      text-align: left;

      font-size: 12px;

      white-space: nowrap;

    }



    table.data th {

      color: var(--muted);

      font-weight: 700;

    }



    .strength {

      display: inline-block;

      min-width: 64px;

      text-align: center;

      padding: 4px 7px;

      border-radius: 7px;

      font-size: 11px;

      font-weight: 700;

      text-transform: capitalize;

    }



    .strength.weak {

      color: #2b5e91;

      background: #e8f2fd;

    }



    .strength.moderate {

      color: #9a6108;

      background: var(--orange-soft);

    }



    .strength.strong {

      color: #a53a34;

      background: var(--red-soft);

    }



    .change-tabs {

      display: flex;

      gap: 5px;

    }



    .change-tabs button {

      border: 1px solid var(--line);

      border-radius: 8px;

      padding: 6px 10px;

      background: #fff;

      color: #5b6f89;

      cursor: pointer;

      font-size: 11px;

      font-weight: 700;

    }



    .change-tabs button.active {

      color: var(--blue);

      background: var(--blue-soft);

      border-color: #a8c9f7;

    }



    .delta {

      font-weight: 750;

    }



    .delta.positive {

      color: #b64b24;

    }



    .delta.negative {

      color: #1769e0;

    }



    .footer {

      padding: 13px 4px 4px;

      color: #7d8999;

      font-size: 10px;

      text-align: center;

    }



    .loading {

      padding: 80px 20px;

      text-align: center;

      color: var(--muted);

    }



    .error {

      margin: 20px;

      padding: 18px;

      border-radius: 12px;

      color: #9d302b;

      background: #fff0ef;

      border: 1px solid #f4c9c5;

    }



    @media (max-width: 1100px) {

      .topbar {

        grid-template-columns: 1fr;

      }



      .archive-block {

        justify-content: flex-start;

      }



      .dashboard {

        grid-template-columns: 1fr;

      }



      .lower-grid {

        grid-template-columns: 1fr;

      }



      .metric-grid {

        grid-template-columns:

          repeat(2, minmax(0, 1fr));

      }

    }



    @media (max-width: 620px) {

      .shell {

        padding: 8px;

      }



      .metric-grid {

        grid-template-columns: 1fr 1fr;

      }



      .main-plot {

        min-height: 390px;

      }



      .panel-head {

        align-items: flex-start;

        flex-direction: column;

      }



      .archive-block {

        flex-wrap: wrap;

      }



      select {

        width: 100%;

      }

    }

    @media (max-width: 860px) {

      .transport-grid,

      .orographic-grid {

        grid-template-columns:

          repeat(2, minmax(0, 1fr));

      }

    }



    @media (max-width: 520px) {

      .transport-grid,

      .orographic-grid {

        grid-template-columns: 1fr;

      }

    }




    .view-tabs {
      display: flex;
      gap: 8px;
      margin: 0 0 14px;
      padding: 6px;
      width: fit-content;
      max-width: 100%;
      background: #eaf0f7;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .view-tab {
      border: 0;
      background: transparent;
      color: #526985;
      padding: 9px 15px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 750;
    }

    .view-tab.active {
      background: #fff;
      color: var(--blue);
      box-shadow: 0 2px 8px rgba(31, 55, 86, 0.08);
    }

    .comparison-header {
      margin-bottom: 14px;
    }

    .comparison-status {
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-left: 5px solid var(--green);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: var(--shadow);
      font-size: 13px;
      line-height: 1.55;
    }

    .comparison-status.waiting {
      border-left-color: var(--orange);
    }

    .comparison-status.error {
      border-left-color: var(--red);
    }

    .comparison-meta {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 14px;
    }

    .comparison-meta-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 13px;
    }

    .comparison-meta-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.45px;
    }

    .comparison-meta-value {
      margin-top: 5px;
      font-size: 15px;
      font-weight: 760;
      line-height: 1.35;
    }

    .comparison-plots {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .comparison-plot-image {
      min-height: 560px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      background: #fff;
    }

    .comparison-plot-image img {
      display: block;
      width: 100%;
      max-height: 740px;
      object-fit: contain;
    }

    .comparison-metrics {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding: 12px;
    }

    .comparison-metric {
      min-height: 112px;
      padding: 12px;
      border: 1px solid var(--line-soft);
      border-radius: 12px;
      background: #fbfdff;
    }

    .comparison-metric-title {
      color: #40516a;
      font-size: 11px;
      font-weight: 750;
    }

    .comparison-metric-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 6px;
      color: #526985;
      font-size: 11px;
    }

    .comparison-metric-row strong {
      color: var(--ink);
    }

    .comparison-delta {
      margin-top: 8px;
      font-size: 16px;
      font-weight: 800;
    }

    .comparison-rmse {
      display: grid;
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 12px;
    }

    .comparison-table td,
    .comparison-table th {
      text-align: right;
    }

    .comparison-table td:first-child,
    .comparison-table th:first-child {
      text-align: left;
    }

    @media (max-width: 1100px) {
      .comparison-meta,
      .comparison-metrics {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .comparison-plots {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 620px) {
      .view-tabs {
        width: 100%;
      }

      .view-tab {
        flex: 1;
      }

      .comparison-meta,
      .comparison-metrics,
      .comparison-rmse {
        grid-template-columns: 1fr;
      }

      .comparison-plot-image {
        min-height: 390px;
      }
    }

    .view-tabs { flex-wrap: wrap; }
    .extra-diagnostics { padding: 14px; }
    .extra-diagnostics summary { cursor: pointer; color: var(--blue); }
    .potek-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 16px; }
    .potek-controls select { max-width: 100%; padding: 9px; border: 1px solid var(--line); border-radius: 8px; background: white; }
    .potek-chart { padding: 0 16px 16px; }
    .potek-chart svg { display: block; width: 100%; height: auto; min-height: 240px; }
    .potek-chart circle { cursor: pointer; }
    .potek-chart-viewport { max-width: 1000px; margin: 0 auto; overflow-x: auto; overscroll-behavior-x: contain; }
    .potek-chart-inner { width: 100%; min-width: 680px; }
    .potek-chart-inner svg { min-height: 0; }
    .potek-chart { min-width: 0; max-width: 100%; }
    .potek-legend { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 auto 14px; max-width: 1000px; color: #526985; font-size: 11px; }
    .potek-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .potek-legend i { width: 18px; height: 12px; border-radius: 3px; }
    .heat-low { background: #568bb7; }
    .heat-lower { background: #bdd5e8; }
    .heat-normal { background: #e9edf0; }
    .heat-upper { background: #ead0ac; }
    .heat-high { background: #bf8053; }
    .heat-missing { background: #fafbfd; border: 1px dashed #d9e1ea !important; }
    .potek-heatmap { display: grid; gap: 4px; padding-bottom: 8px; }
    .heat-label { position: sticky; left: 0; z-index: 1; background: #fff; padding: 10px 8px; font-size: 12px; font-weight: 700; box-shadow: 4px 0 5px rgba(255,255,255,.9); }
    .heat-group { grid-column: 1 / -1; border-top: 1px solid var(--line-soft); background: #f7f9fc; }
    .heat-group span { display: inline-block; position: sticky; left: 0; padding: 6px 8px; color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: .3px; }
    .heat-cell { border: 0; border-radius: 5px; min-height: 40px; padding: 0; cursor: pointer; }
    .heat-cell:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
    .heat-time { font-size: 10px; color: #526985; text-align: center; padding: 8px 0; white-space: pre-line; }
    @media (pointer: coarse) { .potek-chart-inner [data-point] { r: 18px; } }
    @media (max-width: 620px) { .potek-chart { padding: 0 8px 12px; } .heat-label { font-size: 11px; } }
    .potek-note { padding: 12px 16px; color: #526985; font-size: 13px; }
  </style>

</head>



<body>

  <div class="shell">

    <div class="view-tabs" aria-label="Dashboard view">
      <button
        id="viewSoundingBtn"
        class="view-tab active"
        type="button"
        onclick="showSoundingView()"
      >
        Sounding
      </button>

      <button
        id="viewComparisonBtn"
        class="view-tab"
        type="button"
        onclick="showComparisonView()"
      >
        ICON-D2 +12 h
      </button>
      <button id="viewTimeseriesBtn" class="view-tab" type="button"
        onclick="showTimeseriesView()">Time series</button>
      <button id="viewClimatologyBtn" class="view-tab" type="button"
        onclick="showClimatologyView()">Climatology</button>
    </div>

    <div id="app">

      <div class="loading">

        Loading LJLM sounding …

      </div>

    </div>

  </div>



  <script>

    let currentData = null;
    let dashboardPending = false;
    let climatologyMode = 'annual';

    let currentPlot = 'zoom';

    let currentChange = '24h';

    let currentView = 'sounding';

    let currentComparePlot = 'overlay';



    function esc(value) {

      return String(

        value === null ||

        value === undefined

          ? ''

          : value

      )

        .replace(/&/g, '&amp;')

        .replace(/</g, '&lt;')

        .replace(/>/g, '&gt;')

        .replace(/"/g, '&quot;')

        .replace(/'/g, '&#039;');

    }



    function fmt(value, digits) {

      if (

        value === null ||

        value === undefined ||

        !Number.isFinite(Number(value))

      ) {

        return '—';

      }



      const n = Number(value);



      return n.toLocaleString(

        'en-GB',

        {

          minimumFractionDigits:

            digits || 0,

          maximumFractionDigits:

            digits || 0

        }

      );

    }



    function smartFmt(value, unit) {

      if (

        value === null ||

        value === undefined ||

        !Number.isFinite(Number(value))

      ) {

        return '—';

      }



      if (

        unit === '°C' ||

        unit === '°C/km' ||

        unit === 'm/s' ||

        unit === 'mm' ||

        unit === 'g/kg'

      ) {

        return fmt(value, 1);

      }



      if (

        unit === 'kg m⁻¹ s⁻¹' ||

        unit === 'J/kg'

      ) {

        return fmt(value, 0);

      }



      return fmt(value, 0);

    }



    function utcLabel(text) {

      if (!text) {

        return '—';

      }



      return text

        .replace('T', ' ')

        .replace('Z', ' UTC');

    }



    function statusLabel(status) {

      const s =

        String(status || 'ok')

          .toLowerCase();



      if (s === 'waiting') {

        return 'WAITING';

      }



      if (s === 'missing') {

        return 'MISSING';

      }



      return 'OK';

    }



    function metricHtml(item) {

      const percentile = percentileBadge_(item.percentile);

      return (

        '<div class="metric">' +

          '<div class="metric-label">' +

            esc(item.label) +

          '</div>' +

          '<div class="metric-value">' +

            '<span class="metric-number">' +

              smartFmt(

                item.value,

                item.unit

              ) +

            '</span>' +

            '<span class="metric-unit">' +

              esc(item.unit) +

            '</span>' +

          '</div>' +

          percentile +

        '</div>'

      );

    }





    function moistureTransportHtml(data) {

      const block =

        data.moistureTransport || {};



      if (!block.available) {

        return (

          '<div class="caveat">' +

            (

              block.error

                ? (

                    'Moisture transport unavailable: ' +

                    esc(block.error)

                  )

                : 'Moisture transport not available.'

            ) +

          '</div>'

        );

      }



      const cards = [];



      if (

        block.total &&

        block.total.available

      ) {

        cards.push(

          '<div class="transport-card">' +

            '<div class="transport-card-label">' +

              'Total IVT' +

            '</div>' +

            '<div class="transport-card-value">' +

              smartFmt(

                block.total.magnitude,

                'kg m⁻¹ s⁻¹'

              ) +

              '<span class="transport-card-unit">' +

                'kg m⁻¹ s⁻¹' +

              '</span>' +

            '</div>' +

            '<div class="transport-card-sub">' +

              (

                block.total.direction !== null

                  ? (

                      'toward ' +

                      fmt(

                        block.total.direction,

                        0

                      ) +

                      '°'

                    )

                  : ''

              ) +

            '</div>' +

          '</div>'

        );

      }



      (block.layers || [])

        .filter(function(item) {

          return item.available;

        })

        .forEach(function(item) {

          cards.push(

            '<div class="transport-card">' +

              '<div class="transport-card-label">' +

                esc(item.label) +

              '</div>' +

              '<div class="transport-card-value">' +

                smartFmt(

                  item.magnitude,

                  'kg m⁻¹ s⁻¹'

                ) +

                '<span class="transport-card-unit">' +

                  'kg m⁻¹ s⁻¹' +

                '</span>' +

              '</div>' +

              '<div class="transport-card-sub">' +

                (

                  item.direction !== null

                    ? (

                        'toward ' +

                        fmt(item.direction, 0) +

                        '°'

                      )

                    : ''

                ) +

              '</div>' +

            '</div>'

          );

        });



      const humidity =

        (block.humidity || [])

          .filter(function(item) {

            return item.value !== null;

          })

          .map(function(item) {

            return (

              '<span class="humidity-pill">' +

                esc(item.label) +

                ' ' +

                smartFmt(

                  item.value,

                  'g/kg'

                ) +

                ' g/kg' +

              '</span>'

            );

          })

          .join('');



      return (

        '<div class="transport-wrap">' +

          '<div class="transport-grid">' +

            cards.join('') +

          '</div>' +

          (

            humidity

              ? (

                  '<div class="humidity-row">' +

                    humidity +

                  '</div>'

                )

              : ''

          ) +

        '</div>'

      );

    }





    function orographicTransportHtml(data) {

      const block =

        data.orographicTransport || {};



      if (

        !block.available ||

        !block.rows ||

        !block.rows.length

      ) {

        return (

          '<div class="caveat">' +

          'Orographic moisture transport not available.' +

          '</div>'

        );

      }



      const cards =

        block.rows.map(

          function(item) {

            const signedClass =

              item.signed === null

                ? ''

                : (

                    item.signed >= 0

                      ? 'signed-positive'

                      : 'signed-negative'

                  );



            const fallback =

              item.mode === 'pressure_fallback'

                ? (

                    '<span class="fallback-badge">' +

                    'pressure fallback' +

                    '</span>'

                  )

                : '';



            return (

              '<div class="orographic-card">' +

                '<div class="orographic-title">' +

                  esc(item.label) +

                '</div>' +



                '<div class="orographic-layer">' +

                  esc(item.layerLabel) +

                  fallback +

                  (

                    item.normalAzimuth !== null

                      ? (

                          ' · normal ' +

                          fmt(

                            item.normalAzimuth,

                            0

                          ) +

                          '°'

                        )

                      : ''

                  ) +

                '</div>' +



                '<div class="orographic-main">' +

                  '<span class="orographic-number ' + signedClass + '">' +

                    smartFmt(

                      item.signed,

                      'kg m⁻¹ s⁻¹'

                    ) +

                  '</span>' +

                  '<span class="orographic-unit">' +

                    'kg m⁻¹ s⁻¹' +

                  '</span>' +

                '</div>' +



                '<div class="orographic-caption">' +

                  'cross-barrier IVT⊥' +

                '</div>' +



                '<div class="orographic-meta">' +

                  'signed fraction: ' +

                  (

                    item.fractionPct !== null

                      ? (

                          fmt(

                            item.fractionPct,

                            0

                          ) +

                          '%'

                        )

                      : '—'

                  ) +

                  (

                    item.angleDeg !== null

                      ? (

                          ' · angle: ' +

                          fmt(

                            item.angleDeg,

                            0

                          ) +

                          '°'

                        )

                      : ''

                  ) +

                  (

                    item.topPressure !== null

                      ? (

                          '<br>layer top ≈ ' +

                          fmt(

                            item.topPressure,

                            0

                          ) +

                          ' hPa'

                        )

                      : ''

                  ) +

                '</div>' +

              '</div>'

            );

          }

        ).join('');



      return (

        '<div class="orographic-grid">' +

          cards +

        '</div>' +

        '<div class="caveat">' +

          'Positive transport is toward the selected upslope normal. ' +

          'Negative transport is in the opposite direction. ' +

          (

            block.version !== null

              ? (

                  'Orographic diagnostic v' +

                  esc(block.version) +

                  '.'

                )

              : ''

          ) +

        '</div>'

      );

    }





    function percentileBadge_(value) {
      return typeof value === 'number' && Number.isFinite(value)
        ? '<div class="percentile-pill">P' + Math.round(value) + '</div>'
        : '';
    }

    function climatologyHtml(data) {
      const definitions = [
        ['t850', 'T850'], ['pwat_mm', 'PWAT'],
        ['freezing_level_msl_m', 'Freezing level'], ['lifted_index_c', 'Lifted Index'],
        ['shear_0_6km_ms', '0–6 km shear'], ['z500_m', 'Z500']
      ];
      const items = definitions.map(function(definition) {
        const item = (data.climatology || []).find(function(entry) { return entry.key === definition[0]; });
        if (!item || typeof item.value !== 'number' || !Number.isFinite(item.value)) return '';
        return '<div class="clim-summary-item">' +
          '<div class="clim-summary-label">' + esc(definition[1]) + '</div>' +
          '<div class="clim-summary-value">' + smartFmt(item.value, item.unit) + ' ' + esc(item.unit) + '</div>' +
          percentileBadge_(item.percentile) + '</div>';
      }).join('');
      return (items ? '<div class="clim-summary">' + items + '</div>'
        : '<div class="caveat">Climatology not available.</div>') +
        '<div class="clim-summary-action"><button type="button" class="tab-btn" onclick="showClimatologyView()">Open Climatology →</button></div>';
    }


    function inversionHtml(data) {

      const rows =

        (data.inversions || [])

          .map(function(item) {

            return (

              '<tr>' +

                '<td>' +

                  fmt(item.baseAglM, 0) +

                  ' m' +

                '</td>' +

                '<td>' +

                  fmt(item.topAglM, 0) +

                  ' m' +

                '</td>' +

                '<td>' +

                  fmt(item.depthM, 0) +

                  ' m' +

                '</td>' +

                '<td>' +

                  (

                    item.deltaTC !== null

                      ? (

                        (item.deltaTC >= 0 ? '+' : '') +

                        fmt(item.deltaTC, 2) +

                        ' °C'

                      )

                      : '—'

                  ) +

                '</td>' +

                '<td>' +

                  '<span class="strength ' +

                    esc(item.strength) +

                  '">' +

                    esc(

                      item.strength ||

                      '—'

                    ) +

                  '</span>' +

                '</td>' +

              '</tr>'

            );

          })

          .join('');



      if (!rows) {

        return (

          '<div class="caveat">' +

          'No inversion diagnostics available.' +

          '</div>'

        );

      }



      return (

        '<div class="table-wrap">' +

          '<table class="data">' +

            '<thead>' +

              '<tr>' +

                '<th>Base AGL</th>' +

                '<th>Top AGL</th>' +

                '<th>Depth</th>' +

                '<th>ΔT</th>' +

                '<th>Strength</th>' +

              '</tr>' +

            '</thead>' +

            '<tbody>' +

              rows +

            '</tbody>' +

          '</table>' +

        '</div>'

      );

    }



    function changeBlock(data) {

      const block =

        currentChange === '12h'

          ? data.changes.previousTerm

          : data.changes.previousDay;



      if (

        !block ||

        !block.available

      ) {

        return (

          '<div class="caveat">' +

          'Comparison not available.' +

          '</div>'

        );

      }



      const rows =

        block.rows.map(

          function(item) {

            let cls = '';



            if (

              item.delta !== null

            ) {

              cls =

                item.delta > 0

                  ? 'positive'

                  : (

                    item.delta < 0

                      ? 'negative'

                      : ''

                  );

            }



            const delta =

              item.delta === null

                ? '—'

                : (

                    (

                      item.delta > 0

                        ? '+'

                        : ''

                    ) +

                    smartFmt(

                      item.delta,

                      item.unit

                    ) +

                    ' ' +

                    esc(item.unit)

                  );



            return (

              '<tr>' +

                '<td><strong>' +

                  esc(item.label) +

                '</strong></td>' +

                '<td>' +

                  smartFmt(

                    item.current,

                    item.unit

                  ) +

                  ' ' +

                  esc(item.unit) +

                '</td>' +

                '<td>' +

                  smartFmt(

                    item.previous,

                    item.unit

                  ) +

                  ' ' +

                  esc(item.unit) +

                '</td>' +

                '<td class="delta ' +

                  cls +

                '">' +

                  delta +

                '</td>' +

              '</tr>'

            );

          }

        ).join('');



      return (

        '<div class="table-wrap">' +

          '<table class="data">' +

            '<thead>' +

              '<tr>' +

                '<th>Parameter</th>' +

                '<th>Current</th>' +

                '<th>Previous</th>' +

                '<th>Change</th>' +

              '</tr>' +

            '</thead>' +

            '<tbody>' +

              rows +

            '</tbody>' +

          '</table>' +

        '</div>'

      );

    }



    function plotUrl(data) {

      if (currentPlot === 'full') {

        return data.images.skewt;

      }



      if (currentPlot === 'thetae') {

        return data.images.thetae;

      }



      return data.images.skewtZoom;

    }



    function plotTitle() {

      if (currentPlot === 'full') {

        return 'Full Skew-T';

      }



      if (currentPlot === 'thetae') {

        return 'θe / θ profile';

      }



      return 'Low-level profile';

    }



    function archiveOptionsHtml(data) {

      const options = [];



      const latestSelected =

        data.profilePath === 'data/latest.json';



      options.push(

        '<option value=""' +

          (

            latestSelected

              ? ' selected'

              : ''

          ) +

        '>' +

          'Latest · ' +

          esc(

            data.nominalDate +

            ' · ' +

            data.term +

            ' UTC'

          ) +

        '</option>'

      );



      (data.archiveOptions || [])

        .forEach(function(item) {

          const selected =

            item.archiveFile ===

            data.profilePath;



          options.push(

            '<option value="' +

              esc(item.archiveFile) +

            '"' +

              (

                selected

                  ? ' selected'

                  : ''

              ) +

            '>' +

              esc(

                item.nominalDate +

                ' · ' +

                item.term +

                ' UTC'

              ) +

            '</option>'

          );

        });



      return options.join('');

    }



    function render(data) {

      if (currentView !== 'sounding') return;

      currentData = data;



      const status =

        String(

          data.soundingStatus || 'ok'

        ).toLowerCase();



      const html =

        '<header class="topbar">' +



          '<div>' +

            '<div class="brand-title">' +

              '<strong>' +

                esc(

                  String(

                    data.stationName ||

                    'Ljubljana'

                  ).toUpperCase()

                ) +

              '</strong>' +

              '<span class="station-id">' +

                esc(data.station) +

              '</span>' +

            '</div>' +

            '<div class="subtitle">' +

              'Upper-air sounding' +

            '</div>' +

          '</div>' +



          '<div class="time-block">' +

            '<div class="time-main">' +

              esc(data.nominalDate) +

              ' · ' +

              esc(data.term) +

              ' UTC' +

            '</div>' +



            '<div class="time-sub">' +

              'Launch: ' +

              esc(

                utcLabel(

                  data.launchTime

                )

              ) +

            '</div>' +



            '<div class="status-row">' +

              '<span class="status-dot ' +

                esc(status) +

              '"></span>' +

              '<strong>' +

                esc(

                  statusLabel(status)

                ) +

              '</strong>' +

              '<span class="time-sub">' +

                'Processed ' +

                esc(

                  utcLabel(

                    data.processedAt

                  )

                ) +

              '</span>' +

            '</div>' +

          '</div>' +



          '<div class="archive-block">' +

            '<span class="archive-label">' +

              'Archive' +

            '</span>' +

            '<select id="archiveSelect">' +

              archiveOptionsHtml(data) +

            '</select>' +

          '</div>' +



        '</header>' +



        '<main class="dashboard">' +



          '<div class="left-stack">' +
          '<section class="panel">' +

            '<div class="panel-head">' +

              '<div>' +

                '<div class="panel-title" id="plotTitle">' +

                  esc(plotTitle()) +

                '</div>' +

                '<div class="panel-note">' +

                  'Static MetPy product · wind in kt' +

                '</div>' +

              '</div>' +



              '<div class="plot-tabs">' +

                '<button class="tab-btn ' +

                  (

                    currentPlot === 'zoom'

                      ? 'active'

                      : ''

                  ) +

                  '" data-plot="zoom">' +

                  'Low level' +

                '</button>' +



                '<button class="tab-btn ' +

                  (

                    currentPlot === 'full'

                      ? 'active'

                      : ''

                  ) +

                  '" data-plot="full">' +

                  'Full Skew-T' +

                '</button>' +



                '<button class="tab-btn ' +

                  (

                    currentPlot === 'thetae'

                      ? 'active'

                      : ''

                  ) +

                  '" data-plot="thetae">' +

                  'θe / θ' +

                '</button>' +

              '</div>' +

            '</div>' +



            '<div class="main-plot">' +

              '<img id="mainPlotImage" ' +

                'src="' +

                  esc(

                    plotUrl(data)

                  ) +

                '" ' +

                'alt="LJLM sounding">' +



              '<div id="mainPlotError" ' +

                'class="image-error">' +

                'Image is not available for this archived sounding.' +

              '</div>' +

            '</div>' +

          '</section>' +



          '<div class="lower-grid">' +
            '<section class="panel">' +

              '<div class="panel-head">' +

                '<div class="panel-title">' +

                  'Hodograph' +

                '</div>' +

                '<div class="panel-note">' +

                  '0–12 km AGL' +

                '</div>' +

              '</div>' +



              '<div class="hodo-image">' +

                '<img src="' +

                  esc(

                    data.images.hodograph

                  ) +

                '" alt="LJLM hodograph">' +

              '</div>' +

            '</section>' +



            '<section class="panel">' +

              '<div class="panel-head">' +

                '<div class="panel-title">' +

                  'Inversions' +

                '</div>' +

                '<div class="panel-note">' +

                  'Detected layers' +

                '</div>' +

              '</div>' +



              inversionHtml(data) +



            '</section>' +



          '</div></div>' +
          '<div class="right-stack">' +



            '<section class="panel">' +

              '<div class="panel-head">' +

                '<div class="panel-title">' +

                  'Current state' +

                '</div>' +

                '<div class="panel-note">' +

                  'Current sounding' +

                '</div>' +

              '</div>' +



              '<div class="metric-grid">' +

                data.metrics

                  .map(metricHtml)

                  .join('') +

              '</div>' +
              '<details class="extra-diagnostics"><summary>Additional diagnostics · Lifted Index, CAPE/CIN, shear, lapse rates</summary>' +
                '<div class="metric-grid">' + (data.additionalDiagnostics || []).map(metricHtml).join('') + '</div>' +
              '</details>' +

            '</section>' +



            '<section class="panel">' +

              '<div class="panel-head">' +

                '<div class="panel-title">' +

                  'Moisture transport' +

                '</div>' +

                '<div class="panel-note">' +

                  'IVT layers · q profile' +

                '</div>' +

              '</div>' +



              moistureTransportHtml(data) +



            '</section>' +



            '<section class="panel">' +

              '<div class="panel-head">' +

                '<div class="panel-title">' +

                  'Orographic moisture transport' +

                '</div>' +

                '<div class="panel-note">' +

                  'cross-barrier IVT⊥' +

                '</div>' +

              '</div>' +



              orographicTransportHtml(data) +



            '</section>' +



            '<section class="panel">' +

              '<div class="panel-head">' +

                '<div class="panel-title">' +

                  'Climatological context' +

                '</div>' +

                '<div class="panel-note">' +

                  esc(

                    (data.climatologyMeta || {})

                      .referencePeriod ||

                    ''

                  ) +

                '</div>' +

              '</div>' +



              climatologyHtml(data) +



            '</section>' +



            '<section class="panel">' +

              '<div class="panel-head">' +

                '<div>' +

                  '<div class="panel-title">' +

                    'Recent changes' +

                  '</div>' +

                  '<div class="panel-note">' +

                    (

                      currentChange === '24h'

                        ? 'Same nominal term'

                        : 'Previous sounding'

                    ) +

                  '</div>' +

                '</div>' +



                '<div class="change-tabs">' +

                  '<button data-change="12h" class="' +

                    (

                      currentChange === '12h'

                        ? 'active'

                        : ''

                    ) +

                  '">' +

                    '12 h' +

                  '</button>' +



                  '<button data-change="24h" class="' +

                    (

                      currentChange === '24h'

                        ? 'active'

                        : ''

                    ) +

                  '">' +

                    '24 h' +

                  '</button>' +

                '</div>' +

              '</div>' +



              '<div id="changeContent">' +

                changeBlock(data) +

              '</div>' +



            '</section>' +



          '</div>' +

        '</main>' +



        '<div class="footer">' +

          'LJLM 14015 · DWD Open Data BUFR · operational sounding dashboard' +

        '</div>';



      document.getElementById(

        'app'

      ).innerHTML = html;



      bindEvents();

      bindImageFallback();

    }



    function bindImageFallback() {

      const img =

        document.getElementById(

          'mainPlotImage'

        );



      const error =

        document.getElementById(

          'mainPlotError'

        );



      if (!img || !error) {

        return;

      }



      img.onerror = function() {

        img.style.display = 'none';

        error.style.display = 'block';

      };



      img.onload = function() {

        error.style.display = 'none';

        img.style.display = 'block';

      };

    }



    function bindEvents() {

      document

        .querySelectorAll(

          '[data-plot]'

        )

        .forEach(function(button) {

          button.addEventListener(

            'click',

            function() {

              currentPlot =

                button.dataset.plot;



              const img =

                document.getElementById(

                  'mainPlotImage'

                );



              document

    function signedFmt_(
      value,
      unit
    ) {
      if (
        value === null ||
        value === undefined ||
        !Number.isFinite(Number(value))
      ) {
        return '—';
      }

      const n = Number(value);
      const valueText =
        smartFmt(n, unit);

      return (
        n > 0
          ? '+' + valueText
          : valueText
      );
    }

    const timeseriesCache = Object.create(null);
    const timeseriesPending = new Set();
    let timeseriesMode = 'graph';
    let timeseriesWindow = '7d';
    let timeseriesParameter = 'pwat_mm';
    const timeseriesDefinitions = {
      pwat_mm: ['PWAT', 'mm'],
      freezing_level_msl_m: ['Freezing level MSL', 'm'],
      lifted_index_c: ['Lifted Index', '°C'],
      sbcape_jkg: ['SBCAPE', 'J/kg'], sbcin_jkg: ['SBCIN', 'J/kg'],
      mlcape_jkg: ['MLCAPE', 'J/kg'], mlcin_jkg: ['MLCIN', 'J/kg'],
      mucape_jkg: ['MUCAPE', 'J/kg'], mucin_jkg: ['MUCIN', 'J/kg'],
      lapse_rate_850_500_c_per_km: ['850–500 hPa lapse rate', '°C/km'],
      lapse_rate_700_500_c_per_km: ['700–500 hPa lapse rate', '°C/km'],
      shear_0_1km_ms: ['0–1 km shear', 'm/s'],
      shear_0_3km_ms: ['0–3 km shear', 'm/s'],
      shear_0_6km_ms: ['0–6 km shear', 'm/s'],
      shear_sfc_700_ms: ['SFC–700 hPa shear', 'm/s'],
      z500_m: ['Z500', 'm'], thickness_925_500_m: ['925–500 hPa thickness', 'm'],
      t850_c: ['T850', '°C'], td850_c: ['Td850', '°C'],
      t700_c: ['T700', '°C'], td700_c: ['Td700', '°C'],
      t500_c: ['T500', '°C'], td500_c: ['Td500', '°C'],
      q_surface_gkg: ['q surface', 'g/kg'], q925_gkg: ['q925', 'g/kg'],
      q850_gkg: ['q850', 'g/kg'], q700_gkg: ['q700', 'g/kg'],
      ivt_kg_m1_s1: ['IVT magnitude', 'kg m⁻¹ s⁻¹'],
      ivt_direction_deg: ['IVT direction (toward)', '°']
    };
    [['dinaric_west', 'Dinaric west'], ['julian_south', 'Julian south'],
      ['julian_central', 'Julian central'], ['kamnik_savinja', 'Kamnik–Savinja']]
      .forEach(function(barrier) {
        timeseriesDefinitions[barrier[0] + '_signed_ivt'] = [barrier[1] + ' · signed IVT', 'kg m⁻¹ s⁻¹'];
        timeseriesDefinitions[barrier[0] + '_signed_fraction'] = [barrier[1] + ' · signed fraction', '%'];
      });

    function showTimeseriesView() {
      setMainView_('timeseries');
      loadTimeseriesWindow_(timeseriesWindow);
    }

    function loadTimeseriesWindow_(key) {
      timeseriesWindow = key;
      renderTimeseries_();
      if (timeseriesCache[key] || timeseriesPending.has(key)) return;
      timeseriesPending.add(key);
      google.script.run.withSuccessHandler(function(data) {
        timeseriesPending.delete(key);
        timeseriesCache[key] = data;
        if (currentView === 'timeseries' && timeseriesWindow === key) renderTimeseries_();
      }).withFailureHandler(function(error) {
        timeseriesPending.delete(key);
        if (currentView !== 'timeseries' || timeseriesWindow !== key) return;
        renderTimeseries_();
        document.getElementById('potekChart').innerHTML = '<p class="potek-note">' +
          esc(error.message || error) + '</p><button class="tab-btn" id="potekRetry">Try again</button>';
        document.getElementById('potekRetry').onclick = function() { loadTimeseriesWindow_(key); };
      }).getDashboardTimeseries(key);
    }

    function timeseriesPoints_(records, key) {
      return records.map(function(record) {
        const value = record[key];
        return {
          time: Date.parse(record.valid_time),
          validTime: record.valid_time,
          value: typeof value === 'number' && Number.isFinite(value)
            ? value * (key.endsWith('_signed_fraction') ? 100 : 1) : null
        };
      }).filter(function(point) { return Number.isFinite(point.time); })
        .sort(function(a, b) { return a.time - b.time; });
    }

    function timeseriesDate_(time) {
      return new Date(time).toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
    }

    function renderTimeseries_() {
      if (currentView !== 'timeseries') return;
      const data = timeseriesCache[timeseriesWindow];
      const variables = data ? data.variables.filter(function(key) {
        return Object.prototype.hasOwnProperty.call(timeseriesDefinitions, key);
      }) : [];
      if (variables.length && !variables.includes(timeseriesParameter)) timeseriesParameter = variables[0];
      document.getElementById('app').innerHTML = '<section class="panel">' +
        '<div class="panel-head"><div class="panel-title">Time series · OBS</div>' +
        '<div class="panel-note">Nominal time UTC</div></div>' +
        '<div class="potek-controls">' + ['graph', 'heatmap'].map(function(mode) {
          return '<button class="tab-btn ' + (timeseriesMode === mode ? 'active' : '') + '" type="button" aria-pressed="' + (timeseriesMode === mode) + '" data-potek-mode="' + mode + '">' + (mode === 'graph' ? 'Graph' : 'Heatmap') + '</button>';
        }).join('') + [['7d', '7 days'], ['30d', '30 days'], ['90d', '90 days'], ['1y', '1 year']]
          .map(function(window) {
            return '<button type="button" class="tab-btn ' + (timeseriesWindow === window[0] ? 'active' : '') +
              '" aria-pressed="' + (timeseriesWindow === window[0]) + '" data-window="' + window[0] + '">' + window[1] + '</button>';
          }).join('') + '<label for="potekParameter" ' + (timeseriesMode === 'heatmap' ? 'hidden' : '') + '>Parameter</label><select id="potekParameter" ' + (timeseriesMode === 'heatmap' ? 'hidden ' : '') +
          (variables.length ? '' : 'disabled') + '>' + variables.map(function(key) {
            const def = timeseriesDefinitions[key];
            return '<option value="' + esc(key) + '" ' + (key === timeseriesParameter ? 'selected' : '') + '>' +
              esc(def[0] + ' [' + def[1] + ']') + '</option>';
          }).join('') + '</select></div><div id="potekChart" class="potek-chart" aria-live="polite"></div>' +
          '<div id="potekPoint" class="potek-note" aria-live="polite">Select a point for its value and UTC time.</div>' +
          '<div class="potek-note">Missing values and skipped terms are shown as gaps. ' +
          'Signed IVT: positive toward the selected upslope normal, negative in the opposite direction. ' +
          (data ? 'Data generated: ' + esc(data.generatedAt) : '') + '</div></section>';
      document.querySelectorAll('[data-potek-mode]').forEach(function(button) {
        button.onclick = function() { timeseriesMode = button.dataset.potekMode; renderTimeseries_(); };
      });
      document.querySelectorAll('[data-window]').forEach(function(button) {
        button.onclick = function() { loadTimeseriesWindow_(button.dataset.window); };
      });
      document.getElementById('potekParameter').onchange = function(event) {
        timeseriesParameter = event.target.value;
        renderTimeseries_();
      };
      const chart = document.getElementById('potekChart');
      if (!data) { chart.textContent = 'Loading observations …'; return; }
      if (timeseriesMode === 'heatmap') { renderHeatmap_(data); return; }
      const points = timeseriesPoints_(data.records, timeseriesParameter);
      const values = points.filter(function(point) { return point.value !== null; });
      if (!values.length) { chart.textContent = 'No data for this parameter in the selected period.'; return; }
      const def = timeseriesDefinitions[timeseriesParameter];
      let min = Math.min(...values.map(function(p) { return p.value; }));
      let max = Math.max(...values.map(function(p) { return p.value; }));
      const pad = (max - min) * 0.08 || Math.max(Math.abs(max) * 0.08, 1);
      min -= pad; max += pad;
      let start = Date.parse(data.startTime), end = Date.parse(data.endTime);
      if (!Number.isFinite(start)) start = points[0].time;
      if (!Number.isFinite(end)) end = points[points.length - 1].time;
      if (end <= start) end = start + 86400000;
      const x = function(t) { return 75 + (t - start) / (end - start) * 760; };
      const y = function(v) { return 300 - (v - min) / (max - min) * 250; };
      let svg = '<svg viewBox="0 0 860 370" role="img" aria-label="' + esc(def[0] + ' [' + def[1] + '] · OBS UTC') + '">' +
        '<text x="75" y="24" fill="#526985" font-size="15">' + esc(def[0] + ' [' + def[1] + ']') + '</text>';
      for (let i = 0; i <= 4; i++) {
        const value = min + (max - min) * i / 4;
        svg += '<line x1="75" x2="835" y1="' + y(value) + '" y2="' + y(value) + '" stroke="#e2e8f0"/>' +
          '<text x="67" y="' + (y(value) + 4) + '" text-anchor="end" font-size="12" fill="#526985">' + esc(fmt(value, 1)) + '</text>';
      }
      const tickCount = { '7d': 6, '30d': 4, '90d': 3, '1y': 2 }[timeseriesWindow];
      for (let i = 0; i <= tickCount; i++) {
        const time = start + (end - start) * i / tickCount;
        const label = timeseriesDate_(time);
        svg += '<text x="' + x(time) + '" y="325" text-anchor="' + (i === 0 ? 'start' : i === tickCount ? 'end' : 'middle') +
          '" font-size="12" fill="#526985">' + label.slice(5, 10) +
          (timeseriesWindow === '7d' ? '<tspan x="' + x(time) + '" dy="15">' + label.slice(11, 16) + '</tspan>' : '') + '</text>';
      }
      let path = '', previous = null;
      points.forEach(function(point) {
        if (point.value === null) { previous = null; return; }
        path += (previous && point.time - previous.time <= 12 * 3600000 ? ' L' : ' M') + x(point.time) + ',' + y(point.value);
        previous = point;
      });
      svg += '<path d="' + path + '" fill="none" stroke="#2673bd" stroke-width="2"/>';
      values.forEach(function(point, index) {
        const label = timeseriesDate_(point.time) + ' · ' + def[0] + ': ' + fmt(point.value, 2) + ' ' + def[1];
        svg += '<circle cx="' + x(point.time) + '" cy="' + y(point.value) + '" r="12" fill="transparent" ' +
          'tabindex="0" role="button" data-point="' + index + '" aria-label="' + esc(label) + '"><title>' + esc(label) + '</title></circle>' +
          '<circle cx="' + x(point.time) + '" cy="' + y(point.value) + '" r="3" fill="#2673bd" pointer-events="none"/>';
      });
      svg += '<text x="455" y="357" text-anchor="middle" font-size="12" fill="#526985">Nominal / valid time UTC</text></svg>';
      const plotWidth = { '7d': 680, '30d': 780, '90d': 860, '1y': 960 }[timeseriesWindow];
      chart.innerHTML = '<div class="potek-chart-viewport"><div class="potek-chart-inner" style="min-width:' + plotWidth + 'px">' + svg + '</div></div>';
      chart.querySelectorAll('[data-point]').forEach(function(circle) {
        const show = function() { document.getElementById('potekPoint').textContent = circle.getAttribute('aria-label'); };
        circle.onmouseenter = show; circle.onfocus = show; circle.onclick = show;
        circle.onkeydown = function(event) { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); show(); } };
      });
    }

    // Only current OBS variables with matching compact climatology references.
    const heatmapRows = [
      ['t850_c', 't850', 'Temperature'],
      ['t700_c', 't700', 'Temperature'],
      ['t500_c', 't500', 'Temperature'],
      ['freezing_level_msl_m', 'freezing_level_msl_m', 'Temperature'],
      ['pwat_mm', 'pwat_mm', 'Moisture'],
      ['q_surface_gkg', 'q_surface_gkg', 'Moisture'],
      ['q925_gkg', 'q925_gkg', 'Moisture'],
      ['q850_gkg', 'q850_gkg', 'Moisture'],
      ['ivt_kg_m1_s1', 'ivt_kg_m_s', 'Moisture'],
      ['lifted_index_c', 'lifted_index_c', 'Stability'],
      ['mucape_jkg', 'mucape_jkg', 'Stability'],
      ['lapse_rate_850_500_c_per_km', 'lapse_rate_850_500_c_per_km', 'Stability'],
      ['lapse_rate_700_500_c_per_km', 'lapse_rate_700_500_c_per_km', 'Stability'],
      ['shear_0_1km_ms', 'shear_0_1km_ms', 'Wind / shear'],
      ['shear_0_3km_ms', 'shear_0_3km_ms', 'Wind / shear'],
      ['shear_0_6km_ms', 'shear_0_6km_ms', 'Wind / shear'],
      ['shear_sfc_700_ms', 'shear_sfc_700_ms', 'Wind / shear'],
      ['z500_m', 'z500_m', 'Dynamics'],
      ['thickness_925_500_m', 'thickness_925_500_m', 'Dynamics']
    ];
    const heatmapBands = ['< P10', 'P10–25', 'P25–75', 'P75–90', '> P90'];
    const heatmapClasses = ['heat-low', 'heat-lower', 'heat-normal', 'heat-upper', 'heat-high'];
    const heatmapErrors = Object.create(null);

    function heatmapBand_(value, day) {
      const fields = ['p10', 'p25', 'p50', 'p75', 'p90'];
      if (typeof value !== 'number' || !Number.isFinite(value) || !day ||
          !fields.every(function(key, i) { return typeof day[key] === 'number' && Number.isFinite(day[key]) &&
            (i === 0 || day[fields[i - 1]] <= day[key]); })) return null;
      // Equal thresholds stay in the central band, including zero CAPE.
      return value < day.p10 ? 0 : value < day.p25 ? 1 : value <= day.p75 ? 2 : value <= day.p90 ? 3 : 4;
    }

    function loadHeatmapClimate_(key) {
      if (annualCache[key] || annualPending.has(key) || heatmapErrors[key]) return;
      annualPending.add(key);
      google.script.run.withSuccessHandler(function(data) {
        annualPending.delete(key); delete heatmapErrors[key]; annualCache[key] = data; annualParameters = data.parameters;
        if (currentView === 'timeseries' && timeseriesMode === 'heatmap') renderTimeseries_();
        if (currentView === 'climatology' && annualParameter === key) renderAnnual_();
      }).withFailureHandler(function(error) {
        annualPending.delete(key); heatmapErrors[key] = String(error && error.message || error);
        if (currentView === 'timeseries' && timeseriesMode === 'heatmap') renderTimeseries_();
      }).getDashboardClimatology(key);
    }

    function renderHeatmap_(data) {
      const rows = heatmapRows.slice();
      rows.forEach(function(row) { loadHeatmapClimate_(row[1]); });
      const records = data.records.filter(function(record) { return Number.isFinite(Date.parse(record.valid_time)); })
        .slice().sort(function(a, b) { return Date.parse(a.valid_time) - Date.parse(b.valid_time); });
      if (!records.length) { document.getElementById('potekChart').textContent = 'No observations in the selected period.'; return; }
      // Include absent nominal terms, rather than visually collapsing missing observations.
      const byTime = new Map(records.map(function(record) { return [Date.parse(record.valid_time), record]; }));
      const slots = [];
      for (let time = Date.parse(records[0].valid_time); time <= Date.parse(records[records.length - 1].valid_time); time += 12 * 3600000) {
        slots.push(byTime.get(time) || {valid_time: new Date(time).toISOString()});
      }
      const details = [];
      let markup = '<div class="potek-legend">' + heatmapBands.map(function(label, i) {
        return '<span><i class="' + heatmapClasses[i] + '"></i>' + esc(label) + '</span>';
      }).join('') + '<span><i class="heat-missing"></i>No data / reference</span></div>';
      markup += '<div class="potek-chart-viewport"><div class="potek-heatmap" style="grid-template-columns:140px repeat(' + slots.length + ', minmax(28px, 1fr)); min-width:' + Math.max(680, 140 + slots.length * 28) + 'px">';
      let previousGroup = null;
      rows.forEach(function(row) {
        if (row[2] !== previousGroup) {
          markup += '<div class="heat-group"><span>' + esc(row[2]) + '</span></div>';
          previousGroup = row[2];
        }
        const def = timeseriesDefinitions[row[0]], curve = annualCache[row[1]];
        const days = new Map((curve ? curve.days : []).map(function(day) { return [day.day, day]; }));
        markup += '<div class="heat-label">' + esc(def[0]) + '</div>';
        slots.forEach(function(record) {
          const value = record[row[0]], day = days.get(record.valid_time.slice(5, 10));
          const band = heatmapBand_(value, day);
          const raw = typeof value === 'number' && Number.isFinite(value);
          const text = def[0] + ' · ' + timeseriesDate_(Date.parse(record.valid_time)) + ' · ' +
            (raw ? fmt(value, 2) + ' ' + def[1] : 'Missing value') + ' · ' +
            (!raw ? 'Missing observation' : band !== null ? heatmapBands[band] : heatmapErrors[row[1]] ? 'Reference unavailable: ' + heatmapErrors[row[1]] : curve ? 'No climatological reference for this day' : 'Loading reference …') +
            (day ? ' · P10: ' + fmt(day.p10, 2) + ' / P50: ' + fmt(day.p50, 2) + ' / P90: ' + fmt(day.p90, 2) + ' ' + def[1] : '');
          details.push(text);
          markup += '<button type="button" class="heat-cell ' + (band === null ? 'heat-missing' : heatmapClasses[band]) +
            '" data-heat-cell="' + (details.length - 1) + '" aria-label="' + esc(text) + '" title="' + esc(text) + '"></button>';
        });
      });
      markup += '<div class="heat-label">UTC</div>';
      const stride = Math.max(1, Math.ceil(slots.length / ({'7d': 7, '30d': 6, '90d': 5, '1y': 4}[timeseriesWindow])));
      slots.forEach(function(record, i) {
        markup += '<div class="heat-time">' + (i % stride === 0 ? esc(record.valid_time.slice(5, 10) + '\n' + record.valid_time.slice(11, 16)) : '') + '</div>';
      });
      markup += '</div></div>';
      const reference = annualCache.t850;
      if (reference) markup += '<div class="potek-note">' + esc([reference.metadata.reference_period, reference.metadata.window_description, reference.metadata.historical_time_caveat].filter(Boolean).join(' · ')) + '</div>';
      if (Object.keys(heatmapErrors).length) markup += '<button type="button" class="tab-btn" id="heatRetry">Try again · references</button>';
      const chart = document.getElementById('potekChart'); chart.innerHTML = markup;
      chart.querySelectorAll('[data-heat-cell]').forEach(function(cell) {
        const show = function() { document.getElementById('potekPoint').textContent = details[Number(cell.dataset.heatCell)]; };
        cell.onmouseenter = show; cell.onfocus = show; cell.onclick = show;
      });
      if (Object.keys(heatmapErrors).length) document.getElementById('heatRetry').onclick = function() {
        Object.keys(heatmapErrors).forEach(function(key) { delete heatmapErrors[key]; }); renderTimeseries_();
      };
      document.getElementById('potekPoint').textContent = 'Select a cell for its value, UTC time and climatological band.';
    }

    const annualCache = Object.create(null);
    const annualPending = new Set();
    let annualParameter = 't850';
    let annualParameters = [];

    function showClimatologyView() {
      setMainView_('climatology');
      if (climatologyMode === 'current') {
        renderCurrentClimatology_();
        if (!currentData && !dashboardPending) load('');
      } else loadAnnualParameter_(annualParameter);
    }

    function loadAnnualParameter_(key) {
      annualParameter = key;
      renderAnnual_();
      if (annualCache[key] || annualPending.has(key)) return;
      annualPending.add(key);
      google.script.run.withSuccessHandler(function(data) {
        annualPending.delete(key);
        delete heatmapErrors[key];
        annualCache[key] = data;
        annualParameters = data.parameters;
        if (currentView === 'climatology' && annualParameter === key) renderAnnual_();
        if (currentView === 'timeseries' && timeseriesMode === 'heatmap') renderTimeseries_();
      }).withFailureHandler(function(error) {
        annualPending.delete(key);
        if (currentView === 'timeseries' && timeseriesMode === 'heatmap') {
          heatmapErrors[key] = String(error && error.message || error); renderTimeseries_(); return;
        }
        if (currentView !== 'climatology' || annualParameter !== key) return;
        renderAnnual_();
        document.getElementById('annualChart').innerHTML = '<p>' + esc(error && error.message || error) +
          '</p><button id="annualRetry" class="tab-btn">Try again</button>';
        document.getElementById('annualRetry').onclick = function() { loadAnnualParameter_(key); };
      }).getDashboardClimatology(key);
    }

    function climatologyTabs_() {
      return '<div class="potek-controls" aria-label="Climatology view">' +
        [['annual', 'Annual cycle'], ['current', 'Current sounding']].map(function(item) {
          return '<button type="button" class="tab-btn ' + (climatologyMode === item[0] ? 'active' : '') +
            '" aria-pressed="' + (climatologyMode === item[0]) + '" onclick="setClimatologyMode_(\'' + item[0] + '\')">' + item[1] + '</button>';
        }).join('') + '</div>';
    }

    function setClimatologyMode_(mode) {
      climatologyMode = mode;
      showClimatologyView();
    }

    function detailedClimatologyHtml_(data) {
      const rows = (data.climatology || []).map(function(item) {
        const valid = typeof item.percentile === 'number' && Number.isFinite(item.percentile);
        const pct = valid ? Math.max(0, Math.min(100, item.percentile)) : null;
        return '<tr><td><strong>' + esc(item.label) + '</strong></td><td class="value">' +
          smartFmt(item.value, item.unit) + ' ' + esc(item.unit) + '</td><td class="percentile-cell">' +
          (valid ? '<div class="pbar"><div class="pmark" style="left:' + pct + '%"></div></div>' +
            '<div class="p-caption"><span>P10</span><span>P50</span><span>P90</span></div>' : '—') +
          '</td><td>' + (valid ? 'P' + Math.round(item.percentile) : '—') + '</td><td class="range">' +
          smartFmt(item.historicalMin, item.unit) + ' / ' + smartFmt(item.historicalMax, item.unit) + '</td></tr>';
      }).join('');
      const meta = data.climatologyMeta || {};
      return (rows ? '<div class="table-wrap"><table class="clim-table"><thead><tr><th>Parameter</th><th>Current</th><th>Percentile</th><th></th><th>Min / max</th></tr></thead><tbody>' + rows + '</tbody></table></div>' :
        '<div class="caveat">Climatology not available.</div>') +
        '<div class="caveat"><strong>' + esc(meta.referencePeriod || 'Historical reference') + '</strong>' +
        (meta.window ? ' · ' + esc(meta.window) : '') + (meta.caveat ? '<br>' + esc(meta.caveat) : '') + '</div>';
    }

    function renderCurrentClimatology_() {
      if (currentView !== 'climatology' || climatologyMode !== 'current') return;
      document.getElementById('app').innerHTML = '<section class="panel"><div class="panel-head">' +
        '<div class="panel-title">Climatology</div><div class="panel-note">' +
        (currentData ? esc(currentData.nominalDate + ' · ' + currentData.term + ' UTC') : '') +
        '</div></div>' + climatologyTabs_() + '<div id="currentClimateContent">' +
        (currentData ? detailedClimatologyHtml_(currentData) : '<div class="loading">Loading current sounding climatology …</div>') + '</div></section>';
    }

    function annualDay_(day) {
      if (!/^\d{2}-\d{2}$/.test(day || '')) return null;
      const time = Date.parse('2000-' + day + 'T00:00:00Z');
      if (!Number.isFinite(time) || new Date(time).toISOString().slice(5, 10) !== day) return null;
      return (time - Date.UTC(2000, 0, 1)) / 86400000;
    }

    function annualSegments_(days, fields) {
      const segments = []; let segment = [], previous = null;
      days.forEach(function(day) {
        const position = annualDay_(day.day);
        const valid = position !== null && fields.every(function(key) {
          return typeof day[key] === 'number' && Number.isFinite(day[key]);
        });
        if (!valid || (previous !== null && position !== previous + 1)) {
          if (segment.length) segments.push(segment);
          segment = [];
        }
        if (valid) segment.push(day);
        previous = valid ? position : null;
      });
      if (segment.length) segments.push(segment);
      return segments;
    }

    function renderAnnual_() {
      if (currentView !== 'climatology' || climatologyMode !== 'annual') return;
      const data = annualCache[annualParameter];
      document.getElementById('app').innerHTML = '<section class="panel">' +
        '<div class="panel-head"><div class="panel-title">Climatology</div></div>' + climatologyTabs_() +
        '<div class="potek-controls"><label for="annualParameter">Parameter</label><select id="annualParameter" ' +
        (annualParameters.length ? '' : 'disabled') + '>' + annualParameters.map(function(item) {
          return '<option value="' + esc(item.key) + '" ' + (item.key === annualParameter ? 'selected' : '') + '>' +
            esc(item.label + ' [' + item.unit + ']') + '</option>';
        }).join('') + '</select></div><div id="annualChart" class="potek-chart" aria-live="polite"></div>' +
        '<div id="annualDetail" class="potek-note" aria-live="polite">Select a day for its percentiles.</div>' +
        '<div id="annualMeta" class="potek-note"></div></section>';
      document.getElementById('annualParameter').onchange = function(event) { loadAnnualParameter_(event.target.value); };
      const chart = document.getElementById('annualChart');
      if (!data) { chart.textContent = 'Loading climatology …'; return; }
      const metadata = data.metadata;
      const current = typeof data.currentValue === 'number' && Number.isFinite(data.currentValue) && data.currentTime;
      document.getElementById('annualMeta').textContent = [
        data.label + ' [' + data.unit + ']', metadata.reference_period,
        metadata.window_description, metadata.smoothing_description, metadata.historical_time_caveat,
        current ? 'OBS: ' + utcLabel(data.currentTime) + ' · ' + fmt(data.currentValue, 2) + ' ' + data.unit : 'Current observation unavailable.'
      ].filter(Boolean).join(' · ');
      const days = data.days.slice().filter(function(day) { return annualDay_(day.day) !== null; })
        .sort(function(a, b) { return annualDay_(a.day) - annualDay_(b.day); });
      const fields = ['p10', 'p25', 'p50', 'p75', 'p90'];
      const values = days.flatMap(function(day) { return fields.map(function(key) { return day[key]; }); })
        .filter(function(v) { return typeof v === 'number' && Number.isFinite(v); });
      const currentDay = current ? annualDay_(data.currentTime.slice(5, 10)) : null;
      if (currentDay !== null) values.push(data.currentValue);
      if (!values.length) { chart.textContent = 'Climatological values unavailable.'; return; }
      let min = Math.min(...values), max = Math.max(...values);
      const pad = (max - min) * 0.08 || Math.max(Math.abs(max) * 0.08, 1);
      min -= pad; max += pad;
      const x = function(day) { return 75 + day / 365 * 760; };
      const y = function(value) { return 300 - (value - min) / (max - min) * 250; };
      let svg = '<svg viewBox="0 0 860 380" role="group" aria-label="' + esc(data.label + ' [' + data.unit + ']') + '">' +
        '<text x="75" y="24" font-size="15" fill="#526985">' + esc(data.label + ' [' + data.unit + ']') + '</text>';
      for (let i = 0; i <= 4; i++) {
        const value = min + (max - min) * i / 4;
        svg += '<line x1="75" x2="835" y1="' + y(value) + '" y2="' + y(value) + '" stroke="#e2e8f0"/>' +
          '<text x="67" y="' + (y(value) + 4) + '" text-anchor="end" font-size="12" fill="#526985">' + esc(fmt(value, 1)) + '</text>';
      }
      [['p10', 'p90', '#e1ecfa'], ['p25', 'p75', '#b9d4f3']].forEach(function(band) {
        annualSegments_(days, band.slice(0, 2)).forEach(function(segment) {
          const lower = segment.map(function(day) { return x(annualDay_(day.day)) + ',' + y(day[band[0]]); });
          const upper = segment.slice().reverse().map(function(day) { return x(annualDay_(day.day)) + ',' + y(day[band[1]]); });
          svg += '<path d="M' + lower.join(' L') + ' L' + upper.join(' L') + ' Z" fill="' + band[2] + '"/>';
        });
      });
      annualSegments_(days, ['p50']).forEach(function(segment) {
        svg += '<path d="M' + segment.map(function(day) { return x(annualDay_(day.day)) + ',' + y(day.p50); }).join(' L') +
          '" fill="none" stroke="#2673bd" stroke-width="2"/>';
      });
      ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'].forEach(function(label, month) {
        const position = annualDay_(String(month + 1).padStart(2, '0') + '-01');
        svg += '<text x="' + x(position) + '" y="325" text-anchor="middle" font-size="12" fill="#526985">' + label + '</text>';
      });
      days.forEach(function(day, index) {
        const label = day.day + ' · ' + fields.map(function(key) { return key.toUpperCase() + ': ' + fmt(day[key], 2); }).join(' · ') + ' ' + data.unit + ' · n: ' + fmt(day.n, 0);
        svg += '<rect x="' + (x(annualDay_(day.day)) - 1.2) + '" y="45" width="2.4" height="260" fill="transparent" data-annual-day="' + index + '" aria-label="' + esc(label) + '"><title>' + esc(label) + '</title></rect>';
      });
      if (currentDay !== null) {
        const label = 'OBS: ' + utcLabel(data.currentTime) + ' · ' + fmt(data.currentValue, 2) + ' ' + data.unit;
        svg += '<circle data-annual-obs="true" cx="' + x(currentDay) + '" cy="' + y(data.currentValue) + '" r="6" fill="#c9423a" stroke="white" stroke-width="2" tabindex="0" aria-label="' + esc(label) + '"><title>' + esc(label) + '</title></circle>';
      }
      svg += '<text x="75" y="358" font-size="12" fill="#526985">P10–P90 · P25–P75 · P50 (median) · OBS ●</text></svg>';
      chart.innerHTML = svg;
      chart.querySelectorAll('[data-annual-day], [data-annual-obs]').forEach(function(point) {
        const show = function() { document.getElementById('annualDetail').textContent = point.getAttribute('aria-label'); };
        point.onmouseenter = show; point.onclick = show; point.onfocus = show;
      });
    }

    load('');

  </script>

</body>
